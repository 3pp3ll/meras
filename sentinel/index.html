<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel Signals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentinel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: right rail on desktop, off-canvas drawer on phones; one page visible at a time. */
:root {
  --bg: #0A1214; --surface: #101B1E; --sunk: #0D171A; --line: #1E2D31;
  --fg: #ECE6D9; --muted: #8E9C9A; --accent: #CDAA67; --accent-soft: #2A2416;
  --win: #4DBB8D; --win-soft: #12291F; --loss: #E07368; --loss-soft: #2C1715;
  --live: #7FA8D8; --live-soft: #142233; --wait-soft: #152125; --glow: rgba(205,170,103,.10);
  --shade: rgba(0,0,0,.55);
  --f-display: Calibri, Carlito, "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #EDF0EE; --surface: #FFFFFF; --sunk: #E3E8E6; --line: #D2DAD7;
  --fg: #0F1B1D; --muted: #5C6B69; --accent: #8E6F33; --accent-soft: #F1E8D6;
  --win: #1F8A60; --win-soft: #DDF1E8; --loss: #B9473D; --loss-soft: #F7E1DE;
  --live: #3A6EA8; --live-soft: #E0EAF5; --wait-soft: #ECEFEE; --glow: rgba(142,111,51,.10); --shade: rgba(15,27,29,.35);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #EDF0EE; --surface: #FFFFFF; --sunk: #E3E8E6; --line: #D2DAD7;
  --fg: #0F1B1D; --muted: #5C6B69; --accent: #8E6F33; --accent-soft: #F1E8D6;
  --win: #1F8A60; --win-soft: #DDF1E8; --loss: #B9473D; --loss-soft: #F7E1DE;
  --live: #3A6EA8; --live-soft: #E0EAF5; --wait-soft: #ECEFEE; --glow: rgba(142,111,51,.10); --shade: rgba(15,27,29,.35);
  color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); -webkit-tap-highlight-color: transparent; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; border-inline-end: 1px solid var(--line); background: var(--sunk);
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) 20px; padding-inline: 20px; display: flex; flex-direction: column; gap: 24px; z-index: 30; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font: 700 19px/1.1 var(--f-display); }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { text-decoration: none; color: var(--muted); padding: 10px 12px; border-radius: 9px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.nav a svg { flex: none; opacity: .8; }
.nav a:hover { background: var(--surface); color: var(--fg); }
.nav a.on { background: var(--surface); color: var(--fg); box-shadow: inset -2px 0 0 var(--accent); }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.trial { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.trial .k { font-size: 12px; color: var(--muted); }
.trial .v { font: 700 20px var(--f-display); margin: 2px 0 8px; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.fresh { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--win); flex: none; }
.dot.off { background: var(--loss); }

.top { display: none; }
.shade { display: none; }
main { min-width: 0; padding-block: 0 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.hero { position: relative; overflow: hidden; margin-inline: calc(-1 * max(28px, env(safe-area-inset-right, 0px))) calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
  padding-block: 34px 24px; padding-inline: max(28px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: radial-gradient(120% 140% at 85% 0%, var(--glow), transparent 60%); }
.hero .lattice { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--accent); opacity: .14; pointer-events: none;
  -webkit-mask-image: linear-gradient(to left, #000, transparent 70%); mask-image: linear-gradient(to left, #000, transparent 70%); }
.hero-in { position: relative; display: flex; flex-wrap: wrap; gap: 14px; align-items: end; justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
h1 { font: 700 clamp(26px, 4vw, 38px)/1.15 var(--f-display); margin: 6px 0 0; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip.demo { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.i-moon, :root[data-mode="dark"] .i-sun { display: block; } .i-sun, :root[data-mode="dark"] .i-moon { display: none; }

/* شريط الفترة */
.filters { display: grid; gap: 10px; padding-top: 20px; }
.months { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.months button, .seg button { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.months button.on, .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 99px; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 6px 12px; }
.range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.range input { font: 500 13px var(--f-num); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; }

section { padding-top: 22px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.panel h2, .sec-title { font: 700 19px/1.3 var(--f-display); margin: 0 0 12px; }
.gauge-panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.gauge { width: 100%; max-width: 250px; }
.gauge .val { font: 600 32px var(--f-num); fill: var(--fg); }
.gauge .sub { font: 500 11px var(--f-body); fill: var(--muted); }
.verdict { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.verdict.ok { background: var(--win-soft); color: var(--win); }
.wl { display: flex; gap: 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.wl b { display: block; font: 600 18px var(--f-num); color: var(--fg); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 12px; }
.kpi { padding-inline: 12px; border-inline-start: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border: 0; padding-inline-start: 0; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font: 600 clamp(16px, 1.6vw, 21px)/1.3 var(--f-num); white-space: nowrap; }
.pos { color: var(--win); } .neg { color: var(--loss); } .zero { color: var(--muted); }
.curve { width: 100%; height: auto; display: block; }
.curve .g line { stroke: var(--line); } .curve .g text { fill: var(--muted); font: 11px var(--f-num); }
.curve .zero-l { stroke: var(--muted); stroke-dasharray: 3 4; }
.curve .area { fill: var(--accent); opacity: .13; } .curve .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.curve .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.accts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.acct { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.acct .name { font-weight: 600; } .acct small { display: block; font-size: 12px; color: var(--muted); }
.acct .eq { text-align: end; } .acct .eq b { font: 600 20px var(--f-num); display: block; }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
.empty b { display: block; color: var(--fg); font: 700 18px var(--f-display); margin-bottom: 4px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: start; padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; }
.sym { font: 600 15px var(--f-num); } .sym.ar { font: 700 15px var(--f-body); } .sym small { display: block; font: 400 12px var(--f-body); color: var(--muted); }
.lv { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.win { background: var(--win-soft); color: var(--win); } .pill.win2 { background: var(--win); color: var(--surface); }
.pill.loss { background: var(--loss-soft); color: var(--loss); } .pill.live { background: var(--live-soft); color: var(--live); }
.pill.wait, .pill.muted { background: var(--wait-soft); color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.tag.quick { border-color: var(--live); color: var(--live); } .tag.swing { border-color: var(--accent); color: var(--accent); }

.arch { display: grid; gap: 10px; }
.arch-row { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)) auto; gap: 10px; align-items: center; }
.arch-row .m { font: 700 17px var(--f-display); }
.arch-row .m small { display: block; font: 400 12px var(--f-body); color: var(--muted); }
.arch-row .c small { display: block; font-size: 11px; color: var(--muted); } .arch-row .c b { font: 600 16px var(--f-num); }
.btn { font: 600 13px var(--f-body); border-radius: 10px; padding: 9px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: progress; }
.exports { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { font: 500 14px var(--f-body); background: var(--sunk); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; width: 100%; }
.field input.ltr { direction: ltr; text-align: left; font-family: var(--f-num); }
.stack { display: grid; gap: 14px; }
.when { display: block; font: 500 11px var(--f-num); color: var(--muted); margin-top: 4px; white-space: nowrap; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.panel h3 { font: 700 15px var(--f-display); margin: 4px 0 0; }
.lrow { display: flex; gap: 6px; } .lrow input { flex: 1; min-width: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mrow .who { display: grid; gap: 2px; min-width: 0; } .mrow .who span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 600px) { .mrow { grid-template-columns: minmax(0, 1fr) auto; } .mrow .row { grid-column: 1 / -1; } .lrow { flex-wrap: wrap; } }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); }
ol.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }

/* تقرير الطباعة (يتحول لـ PDF) */
#report-sheet { position: fixed; top: 0; left: -10000px; width: 794px; background: #fff; color: #0F1B1D; font: 14px/1.6 "IBM Plex Sans Arabic", sans-serif; padding: 44px 48px; direction: rtl; }
#report-sheet h1 { font: 700 28px "IBM Plex Sans Arabic", sans-serif; margin: 0 0 4px; color: #0F1B1D; }
#report-sheet .rs-sub { color: #5C6B69; font-size: 13px; margin-bottom: 18px; }
#report-sheet .rs-k { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
#report-sheet .rs-k div { border: 1px solid #D2DAD7; border-radius: 10px; padding: 10px 12px; }
#report-sheet .rs-k small { display: block; color: #5C6B69; font-size: 11px; }
#report-sheet .rs-k b { font: 600 18px "IBM Plex Mono", monospace; direction: ltr; unicode-bidi: isolate; }
#report-sheet table { min-width: 0; font-size: 12px; margin-bottom: 14px; }
#report-sheet th { background: #F1E8D6; color: #5C4A22; padding: 7px 8px; }
#report-sheet td { padding: 6px 8px; border-bottom: 1px solid #E3E8E6; }
#report-sheet h2 { font: 700 16px "IBM Plex Sans Arabic", sans-serif; margin: 16px 0 8px; color: #8E6F33; }
#report-sheet .rs-foot { margin-top: 18px; padding-top: 10px; border-top: 1px solid #D2DAD7; color: #5C6B69; font-size: 11px; display: flex; justify-content: space-between; }

@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; } .kpi:nth-child(3) { border: 0; padding-inline-start: 0; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 0 0 auto; width: min(300px, 84vw); height: 100%; transform: translateX(105%); transition: transform .22s ease; box-shadow: -12px 0 40px rgba(0,0,0,.3); }
  .rail.open { transform: none; }
  .shade { display: block; position: fixed; inset: 0; background: var(--shade); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .top { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--line);
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .t { flex: 1; min-width: 0; font: 700 17px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-right, 0px))) calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px)); padding-block: 20px 18px; }
  .hero h1 { font-size: 26px; }
  .arch-row { grid-template-columns: minmax(0, 1fr) repeat(3, minmax(0, auto)); }
  .arch-row .exports { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .enter-next { animation: sn .22s ease-out; } .enter-prev { animation: sp .22s ease-out; }
  @keyframes sn { from { opacity: 0; transform: translateX(-20px); } } @keyframes sp { from { opacity: 0; transform: translateX(20px); } }
}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="shade" id="shade"></div>
  <aside class="rail" id="rail" aria-label="القائمة">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="var(--accent)" stroke-width="1.8"><rect x="9" y="9" width="22" height="22" rx="1"/><rect x="9" y="9" width="22" height="22" rx="1" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4.5"/></g></svg>
      <div><b>Sentinel Signals</b><small>توصيات الأسهم النقية</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#overview"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>الأداء</a>
      <a href="#signals"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>سجل التوصيات</a>
      <a href="#archive"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></g></svg>الأرشيف الشهري</a>
      <a href="#reports"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M12 12v6M9 15l3 3 3-3"/></g></svg>التقارير والتصدير</a>
      <a href="#control"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></g></svg>لوحة التحكم</a>

<script>
(function () {
  "use strict";
  var REPO = "3pp3ll/sentinel-signals", FILE = "data/dashboard.json";
  var HOSTED = !window.claude && /^https?:$/.test(location.protocol) && !/[?&]demo\b/.test(location.search);
  var START_EQ = 100000, TARGET = 0.8;
  var MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  var CAT = { ai: "الذكاء الاصطناعي", leaders: "القيادية", gold: "الذهب", sa_leaders: "القيادية السعودية", sa_tech: "التقنية السعودية", cn_ai: "🇨🇳 الذكاء الاصطناعي الصيني", us_movers: "🔥 الأكثر حركة", sa_movers: "🔥 الأكثر حركة", sa_gold: "الذهب (تداول)" };
  var MKT = { us: "🇺🇸 الأمريكي", sa: "🇸🇦 السعودي" };
  var PAGES = ["overview", "signals", "archive", "reports", "control", "settings"];
  var TITLES = { overview: "الأداء", signals: "سجل التوصيات", archive: "الأرشيف الشهري", reports: "التقارير والتصدير", control: "لوحة التحكم", settings: "الإعدادات" };
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var SAR = function () { return state && state.market === "sa"; };
  var CUR = function () { return SAR() ? " SAR" : "$"; };
  var CURW = function () { return SAR() ? "ريال" : "$"; };
  var money = function (x, sign) { var s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + CUR(); return sign ? (x > 0 ? "+" : x < 0 ? "−" : "") + s : (x < 0 ? "−" : "") + s; };
  var pct = function (x) { return x == null ? "—" : Math.round(x * 100) + "%"; };
  // أوقات الوكيل بتوقيت UTC: نحولها لتوقيت جهازك. التواريخ بدون وقت تبقى كما هي.
  var D = function (s) { return s ? new Date(s.length <= 10 ? s + "T00:00:00" : (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z")) : null; };
  var when = function (s) { var d = D(s); return d ? ymd(d) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") : ""; };
  var ymd = function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  var monthKey = function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  var monthName = function (k) { var p = k.split("-"); return MONTHS[+p[1] - 1] + " " + p[0]; };

  var DATA = null, DEMO = false, FETCHED = null, ERR = null, ERR_DETAIL = "";
  var state = { period: "month:" + monthKey(new Date()), from: "", to: "", strat: "all", market: "us" };
  try { Object.assign(state, JSON.parse(store.get("sentinel.view") || "{}")); } catch (e) {}
  if (/^month:/.test(state.period) && state.period !== "month:" + monthKey(new Date()) && !store.get("sentinel.pinned")) state.period = "month:" + monthKey(new Date());
  var saveView = function () { store.set("sentinel.view", JSON.stringify(state)); };

  /* ---------- البيانات ---------- */
  function token() {
    var own = store.get("sentinel.token");
    if (own) return { t: own, src: "own" };
    try { var m = JSON.parse(store.get("meras.sync") || "{}"); if (m.token) return { t: m.token, src: "meras" }; } catch (e) {}
    return null;
  }
  function load(force) {
    ERR = null;
    if (!HOSTED) { DEMO = true; DATA = demoData(); FETCHED = new Date(); render(); return; }
    var cached = store.get("sentinel.data");
    if (cached && !DATA) { try { DATA = JSON.parse(cached); FETCHED = D(store.get("sentinel.fetched")); } catch (e) {} }
    var tk = token();
    if (!tk) { ERR = "token"; render(); return; }
    render();
    fetch("https://api.github.com/repos/" + REPO + "/contents/" + FILE + "?t=" + Date.now(), {
      cache: "no-store", headers: { Authorization: "Bearer " + tk.t, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" }
    }).then(function (r) {
      if (!r.ok) throw { code: r.status };
      return r.json();
    }).then(function (d) {
      DATA = d; FETCHED = new Date(); store.set("sentinel.data", JSON.stringify(d)); store.set("sentinel.fetched", FETCHED.toISOString());
      if (force) toast("تم تحديث البيانات");
      render();
    }).catch(function (e) {
      ERR = e && e.code === 401 ? "401" : e && e.code === 404 ? "404" : "net";
      ERR_DETAIL = e && e.code ? "رمز الخطأ " + e.code : (e && e.message) || "";
      if (!force && !load.retried) { load.retried = true; setTimeout(function () { load(true); }, 4000); }
      render();
    });
  }

  /* ---------- الحسابات ---------- */
  var DECIDED = { tp1: 1, tp2: 1, stopped: 1, timeout: 1 };
  function decidedAt(s) { return (s.status === "tp1" || s.status === "tp2") ? D(s.tp1_at || s.closed_at) : (s.status === "stopped" || s.status === "timeout") ? D(s.closed_at) : null; }
  function isWin(s) { return s.status === "tp1" || s.status === "tp2" || (s.status === "timeout" && (s.pnl || 0) > 0); }
  function trialStart() { return DATA && DATA.trial_start ? D(DATA.trial_start) : null; }

  function periodRange(p) {
    p = p || state.period;
    var now = new Date(), ts = trialStart() || now;
    if (p === "all") return { from: ts, to: now, label: "كل الفترة", key: "all" };
    if (p === "range") {
      var f = D(state.from) || ts, t = D(state.to) || now;
      t = new Date(t.getFullYear(), t.getMonth(), t.getDate(), 23, 59, 59);
      return { from: f, to: t, label: "من " + ymd(f) + " إلى " + ymd(t), key: "range" };
    }
    var k = p.replace("month:", ""), y = +k.split("-")[0], m = +k.split("-")[1] - 1;
    return { from: new Date(y, m, 1), to: new Date(y, m + 1, 0, 23, 59, 59), label: monthName(k), key: k };
  }
  function filtered(range, strat) {
    strat = strat || state.strat;
    return (DATA ? DATA.signals : []).filter(function (s) { return (s.market || "us") === state.market && (strat === "all" || s.strategy === strat); });
  }
  /* رسوم التنفيذ التقديرية: دراية 2.25$ لكل أمر (شراء وبيع = 4.50$)، والوسيط السعودي تقريباً 0.15% لكل جهة */
  var FEES = { us_per_order: 2.25, sa_pct: 0.15 };
  function feeOf(s) {
    if (!s.entered) return 0;
    return (s.market || "us") === "sa" ? 2 * (s.size || 0) * FEES.sa_pct / 100 : 2 * FEES.us_per_order;
  }
  function stats(range, strat) {
    var all = filtered(range, strat), within = function (d) { return d && d >= range.from && d <= range.to; };
    var issued = all.filter(function (s) { return within(D(s.created_at)); });
    var decided = all.filter(function (s) { return DECIDED[s.status] && within(decidedAt(s)); });
    var wins = decided.filter(isWin), losses = decided.filter(function (s) { return !isWin(s); });
    var sum = function (a) { return a.reduce(function (t, s) { return t + (s.pnl || 0); }, 0); };
    var open = all.filter(function (s) { return s.status === "open" && D(s.created_at) <= range.to; });
    var curve = decided.slice().sort(function (a, b) { return decidedAt(a) - decidedAt(b); }).reduce(function (acc, s) { acc.push((acc.length ? acc[acc.length - 1] : 0) + (s.pnl || 0)); return acc; }, []);
    return { issued: issued, decided: decided, wins: wins.length, losses: losses.length, open: open.length,
      rate: decided.length ? wins.length / decided.length : null, net: sum(decided),
      fees: decided.reduce(function (t, s) { return t + feeOf(s); }, 0),
      netAfter: sum(decided) - decided.reduce(function (t, s) { return t + feeOf(s); }, 0),
      avgWin: wins.length ? sum(wins) / wins.length : null, avgLoss: losses.length ? sum(losses) / losses.length : null, curve: curve };
  }
  function equityFor(code, range) {
    var key = SAR() ? "sa-" + code : code;
    var rows = (DATA ? DATA.equity : []).filter(function (e) { return e.strategy === key; });
    var upTo = rows.filter(function (e) { return D(e.day) <= range.to; }), before = rows.filter(function (e) { return D(e.day) < range.from; });
    if (!upTo.length) return null;
    var end = upTo[upTo.length - 1].equity, start = before.length ? before[before.length - 1].equity : startEq();
    return { end: end, change: end - start, day: upTo[upTo.length - 1].day };
  }
  function noData(range) {
    var ts = trialStart();
    return !DATA || !ts || range.to < ts || range.from > new Date();
  }
  function monthKeys() {
    var ts = trialStart(), out = [], now = new Date();
    if (!ts) return [monthKey(now)];
    var d = new Date(ts.getFullYear(), ts.getMonth(), 1);
    while (d <= now) { out.push(monthKey(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    return out.reverse();
  }

  /* ---------- الرسم ---------- */
  function statusInfo(s) {
    if (s.status === "open") return s.entered ? ["داخل الصفقة", "live"] : ["بانتظار الدخول", "wait"];
    if (s.status === "tp1") return s.strategy === "quick" ? ["تحقق الهدف", "win"] : (s.closed_at && s.closed_at !== s.tp1_at ? ["الهدف الأول", "win"] : ["الهدف الأول · مستمرة", "win"]);
    return { tp2: ["الهدف البعيد", "win2"], stopped: ["ضرب الوقف", "loss"], timeout: [(s.pnl || 0) > 0 ? "انتهت المدة · ربح" : "انتهت المدة · خسارة", (s.pnl || 0) > 0 ? "win" : "loss"], cancelled: ["ملغاة", "muted"] }[s.status] || [s.status, "muted"];
  }
  var stratName = function (c) { return c === "quick" ? "سريعة" : "متوسطة"; };

  function gauge(rate) {
    var r = 80, cx = 100, cy = 96, len = Math.PI * r, f = rate == null ? 0 : Math.max(0, Math.min(1, rate)), a = Math.PI * (1 - TARGET);
    var met = rate != null && rate >= TARGET;
    var tx = function (rr) { return [(cx + rr * Math.cos(a)).toFixed(1), (cy - rr * Math.sin(a)).toFixed(1)]; };
    var p1 = tx(r - 12), p2 = tx(r + 12), arc = "M " + (cx - r) + " " + cy + " A " + r + " " + r + " 0 0 1 " + (cx + r) + " " + cy;
    return '<svg class="gauge" viewBox="0 0 200 120" role="img" aria-label="نسبة النجاح ' + pct(rate) + '"><path d="' + arc + '" fill="none" stroke="var(--sunk)" stroke-width="12" stroke-linecap="round"/>' +
      (rate == null ? "" : '<path d="' + arc + '" fill="none" stroke="' + (met ? "var(--win)" : "var(--accent)") + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + len.toFixed(2) + '" stroke-dashoffset="' + (len * (1 - f)).toFixed(2) + '"/>') +
      '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" stroke="var(--fg)" stroke-width="2"/>' +
      '<text class="val" x="100" y="88" text-anchor="middle">' + pct(rate) + '</text><text class="sub" x="100" y="110" text-anchor="middle">الهدف ' + Math.round(TARGET * 100) + '% للتحويل للمدفوع</text></svg>';
  }
  function curveSvg(vals) {
    var w = 640, h = 200, pad = 26, right = w - 70, pts = [0].concat(vals);
    var lo = Math.min.apply(null, pts.concat([0])), hi = Math.max.apply(null, pts.concat([0]));
    var raw = Math.max((hi - lo) / 4, 1), mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return s >= raw; })[0];
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step || step;
    var sx = (right - pad) / Math.max(pts.length - 1, 1), sy = (h - 2 * pad) / (hi - lo);
    var xy = pts.map(function (v, i) { return [pad + i * sx, h - pad - (v - lo) * sy]; });
    var line = xy.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "), zy = h - pad - (0 - lo) * sy;
    var g = ""; for (var v = lo; v <= hi + 1e-9; v += step) { var y = h - pad - (v - lo) * sy; g += '<line x1="' + pad + '" x2="' + right + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (right + 8) + '" y="' + (y + 4).toFixed(1) + '" direction="ltr">' + (v ? (v > 0 ? "+" : "−") + Math.abs(v).toLocaleString("en-US") + (SAR() ? "" : "$") : "0") + "</text>"; }
    var last = xy[xy.length - 1];
    return '<svg class="curve" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="الربح التراكمي"><g class="g">' + g + '</g><line class="zero-l" x1="' + pad + '" x2="' + right + '" y1="' + zy.toFixed(1) + '" y2="' + zy.toFixed(1) + '"/>' +
      '<polygon class="area" points="' + xy[0][0].toFixed(1) + "," + zy.toFixed(1) + " " + line + " " + last[0].toFixed(1) + "," + zy.toFixed(1) + '"/><polyline class="ln" points="' + line + '"/><circle class="dot" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="5"/></svg>';
  }
  var cls = function (x) { return x > 0 ? "pos" : x < 0 ? "neg" : "zero"; };

  function filtersHtml(page) {
    if (page === "settings" || page === "archive" || page === "control") return "";
    var mk = monthKeys(), p = state.period;
    var chips = mk.map(function (k) { return '<button type="button" data-period="month:' + k + '" class="' + (p === "month:" + k ? "on" : "") + '">' + (k === monthKey(new Date()) ? "هذا الشهر · " : "") + monthName(k) + "</button>"; }).join("") +
      '<button type="button" data-period="all" class="' + (p === "all" ? "on" : "") + '">كل الفترة</button><button type="button" data-period="range" class="' + (p === "range" ? "on" : "") + '">فترة محددة</button>';
    var mseg = '<div class="seg" role="group" aria-label="السوق">' + ["us", "sa"].map(function (m) { return '<button type="button" data-market="' + m + '" class="' + (state.market === m ? "on" : "") + '">' + MKT[m] + "</button>"; }).join("") + "</div>";
    var seg = '<div class="seg" role="group" aria-label="نوع الصفقات">' + [["all", "الكل"], ["swing", "متوسطة"], ["quick", "سريعة"]].map(function (x) { return '<button type="button" data-strat="' + x[0] + '" class="' + (state.strat === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("") + "</div>";
    var range = p === "range" ? '<div class="range"><label for="f-from">من</label><input id="f-from" type="date" value="' + esc(state.from) + '"><label for="f-to">إلى</label><input id="f-to" type="date" value="' + esc(state.to) + '"></div>' : "";
    return '<div class="months">' + chips + '</div><div class="row">' + mseg + seg + range + "</div>";
  }

  function emptyBox(range) {
    var ts = trialStart();
    return '<div class="empty"><b>لا يوجد بيانات</b>' + (ts ? "التجربة بدأت في <span class=\"num\">" + ymd(ts) + "</span>، وهذي الفترة (" + esc(range.label) + ") قبلها أو بعد اليوم." : "ما وصلت بيانات للحين.") + "</div>";
  }

  function pageOverview() {
    var range = periodRange();
    if (noData(range)) return emptyBox(range);
    var st = stats(range), accts = ["swing", "quick"].filter(function (c) { return state.strat === "all" || state.strat === c; });
    var acc = accts.map(function (c) {
      var e = equityFor(c, range);
      return '<div class="panel acct"><div><span class="name">حساب ' + stratName(c) + (SAR() ? " · افتراضي" : "") + '</span><small>' + (e ? "رصيد يوم " + '<span class="num">' + e.day + "</span>" : "ما فيه لقطة رصيد في هذي الفترة") + '</small></div><div class="eq"><b class="num">' + (e ? money(e.end) : "—") + '</b>' + (e ? '<span class="num ' + cls(e.change) + '">' + money(e.change, true) + "</span>" : "") + "</div></div>";
    }).join("");

      save(pdf.output("blob"), R.file + ".pdf");
    });
  }

  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2800); }

  /* ---------- بيانات العرض التجريبي ---------- */
  function demoData() {
    var seed = 11, rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    var syms = [["NVDA", "ai", 202], ["MSFT", "leaders", 512], ["AMD", "ai", 260], ["AVGO", "ai", 340], ["COST", "leaders", 905], ["META", "leaders", 610], ["LRCX", "ai", 150], ["ABBV", "leaders", 284], ["ISRG", "leaders", 436], ["TXN", "leaders", 300], ["PANW", "ai", 205], ["NOW", "ai", 980]];
    var start = new Date(2026, 8, 1), now = new Date(), sigs = [], eq = [], id = 1, bal = { swing: START_EQ, quick: START_EQ };
    for (var d = new Date(start); d <= now; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      ["swing", "quick"].forEach(function (code) {
        if (rnd() > (code === "quick" ? 0.45 : 0.25)) return;
        var sy = syms[Math.floor(rnd() * syms.length)], entry = Math.round(sy[2] * (0.95 + rnd() * 0.1) * 100) / 100;
        var tp1p = code === "quick" ? 0.03 : 0.10, stopP = code === "quick" ? 0.018 : 0.04, shares = Math.floor(3000 / entry);
        var created = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 21, 40), daysTo = 1 + Math.floor(rnd() * (code === "quick" ? 4 : 14));
        var dec = new Date(created.getTime() + daysTo * 864e5), r = rnd(), s = { id: id++, strategy: code, symbol: sy[0], category: sy[1], entry: entry, price: entry,
          tp1: Math.round(entry * (1 + tp1p) * 100) / 100, tp2: Math.round(entry * (code === "quick" ? 1 + tp1p : 1.2) * 100) / 100, stop: Math.round(entry * (1 - stopP) * 100) / 100, shares: shares, size: 3000, purify: 1.2,
          created_at: created.toISOString().slice(0, 16), entered: true, entered_at: created.toISOString().slice(0, 16) };
        if (dec > now) { s.status = "open"; s.entered = rnd() > 0.4; }
        else if (r < 0.72) { s.status = code === "swing" && rnd() < 0.2 ? "tp2" : "tp1"; s.pnl = Math.round(shares * ((s.status === "tp2" ? s.tp2 : s.tp1) - entry) * 100) / 100; s.tp1_at = s.closed_at = dec.toISOString().slice(0, 16); }
        else { s.status = "stopped"; s.pnl = Math.round(shares * (s.stop - entry) * 100) / 100; s.closed_at = dec.toISOString().slice(0, 16); }
        if (s.pnl) bal[code] += s.pnl;
        sigs.push(s);
      });
      ["swing", "quick"].forEach(function (c) { eq.push({ day: ymd(d), strategy: c, equity: Math.round(bal[c] * 100) / 100 }); });
    }
    return { generated_at: now.toISOString().slice(0, 16), trial_start: ymd(start), trade_size_usd: 3000, signals: sigs, equity: eq, strategies: {} };
  }
