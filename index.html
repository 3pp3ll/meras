<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مِراس</title>

<meta name="theme-color" content="#14284F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مِراس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: the مدرج (staircase) is the spine. Levels are literal steps you climb; a navy band carries the hero, everything else sits quietly on a cool paper ground. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF4;
  --ink:#0F1F3D; --muted:#55637F; --line:#D5DCE9;
  --navy:#14284F; --navy-fg:#EEF2FA; --navy-muted:#A9B7D4; --navy-line:#2B4175;
  --amber:#E09A1A; --amber-ink:#8A5300; --amber-soft:#FBEFD6; --on-amber:#1A1300;
  --up:#0B7F57; --up-soft:#DDF3EA; --down:#BE3329; --down-soft:#FBE3E0;
  --code-bg:#0E1B36; --code-fg:#DCE6FA;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --gap:16px; --wrap:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1428; --surface:#111F3C; --sunk:#0D1931;
    --ink:#E8EDF8; --muted:#97A6C4; --line:#24365B;
    --navy:#16294F; --navy-fg:#EEF2FA; --navy-muted:#A9B7D4; --navy-line:#2F4780;
    --amber:#F0A93A; --amber-ink:#F3B75A; --amber-soft:#3A2C0E; --on-amber:#1A1300;
    --up:#3FCB96; --up-soft:#0F3328; --down:#F27C72; --down-soft:#3D1B19;
    --code-bg:#07101F; --code-fg:#DCE6FA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1428; --surface:#111F3C; --sunk:#0D1931;
  --ink:#E8EDF8; --muted:#97A6C4; --line:#24365B;
  --navy:#16294F; --navy-fg:#EEF2FA; --navy-muted:#A9B7D4; --navy-line:#2F4780;
  --amber:#F0A93A; --amber-ink:#F3B75A; --amber-soft:#3A2C0E; --on-amber:#1A1300;
  --up:#3FCB96; --up-soft:#0F3328; --down:#F27C72; --down-soft:#3D1B19;
  --code-bg:#07101F; --code-fg:#DCE6FA;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:24px;font-weight:700}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:15px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber);border-radius:8px 8px 0 0}
.tools{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.nav{order:3;flex-basis:100%}.tools{margin-inline-start:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600;font-size:15px;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13.5px}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{background:var(--navy);color:var(--navy-fg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:52px 0}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:700;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p.lead{color:var(--navy-muted);font-size:18px;max-width:46ch;margin-block:16px 24px}
.hero .copy{padding-bottom:52px}
.hero .btn.ghost{color:var(--navy-fg);border-color:var(--navy-line)}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--amber);font-weight:600;margin-bottom:10px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:8px;padding-top:36px}.hero .copy{padding-bottom:24px}}

/* the staircase */
.stairs{display:flex;align-items:flex-end;gap:5px}
.step{flex:1;min-width:0;height:calc(34px + var(--n)*30px);border-radius:6px 6px 0 0;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1px solid var(--line);border-bottom:0;background:var(--surface);color:var(--muted);font-size:12.5px;line-height:1.35;text-decoration:none}
.step b{font-family:var(--mono);font-size:17px;color:var(--ink)}
.step.free{border-color:var(--amber)}
.step.free b{color:var(--amber-ink)}
.step.done{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.step.done b{color:var(--on-amber)}
.step.locked{border-style:dashed;background:transparent}
.hero .step{background:transparent;border-color:var(--navy-line);color:var(--navy-muted)}
.hero .step b{color:var(--navy-fg)}
.hero .step.free{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.hero .step.free b{color:var(--on-amber)}
.hero .stairs{gap:6px}
.hero .step{height:calc(46px + var(--n)*40px);font-size:13px}
@media (max-width:820px){.hero .step{height:calc(40px + var(--n)*22px)}}

/* sections */
main{display:block;min-height:60vh}
.sec{padding-block:44px}
.sec + .sec{padding-top:8px}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.sec-head h2{font-size:28px}
.sec-head p{color:var(--muted);max-width:62ch}
.page-head{padding-block:34px 6px}
.page-head h1{font-size:34px}
.page-head p{color:var(--muted);max-width:64ch;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media (max-width:820px){.grid3,.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel h3{font-size:20px}
.track-card{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.track-card:hover{border-color:var(--amber)}
.track-card .who{font-size:13px;color:var(--amber-ink);font-weight:600}
.track-card .meter{margin-top:auto}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);border-radius:3px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.flow > div{padding:18px;border-inline-start:1px solid var(--line)}
.flow > div:first-child{border-inline-start:0}
.flow .k{font-family:var(--mono);color:var(--amber-ink);font-size:13px}
.flow h4{font-size:17px;margin-block:2px 4px}
@media (max-width:820px){.flow{grid-template-columns:1fr 1fr}.flow > div:nth-child(3){border-inline-start:0}.flow > div:nth-child(n+3){border-top:1px solid var(--line)}}
.notice{border:1px dashed var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:12px 16px;font-size:14.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tag.up{background:var(--up-soft);color:var(--up)}
.tag.down{background:var(--down-soft);color:var(--down)}

/* tracks page */
.track{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;padding-block:28px;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0}
@media (max-width:820px){.track{grid-template-columns:1fr}}
.levels{display:flex;flex-direction:column;gap:10px}
.level{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.level.locked{background:transparent;border-style:dashed}
.level-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.level-head b{font-family:var(--mono);color:var(--amber-ink)}
.level-head h4{font-size:17px;flex:1;min-width:0}
.lessons{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;text-decoration:none}
.lessons a:hover{background:var(--sunk)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;line-height:1}
.dot.done{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:760px;padding-block:28px 56px}
.crumbs{font-size:13.5px;color:var(--muted)}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.lesson h1{font-size:34px}
.prose{display:flex;flex-direction:column;gap:14px;font-size:17px}
.prose h3{font-size:21px;margin-top:10px}
.prose ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:1px 6px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.code{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);direction:ltr;text-align:left}
.code pre{margin:0;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.65}
.code .cap{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;font-family:var(--mono);font-size:12px;color:var(--navy-muted);border-bottom:1px solid var(--navy-line)}
.code .cap button{background:transparent;border:1px solid var(--navy-line);color:var(--code-fg);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer}
.figure{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;overflow-x:auto}
.figure svg{display:block;width:100%;min-width:480px;height:auto;direction:ltr}
.figure figcaption,.figcap{font-size:13.5px;color:var(--muted);margin-top:8px}
figure{margin:0}
.c-up{fill:var(--up);stroke:var(--up)} .c-down{fill:var(--down);stroke:var(--down)}
.c-grid{stroke:var(--line);stroke-width:1} .c-text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.c-label{fill:var(--ink);font-family:var(--body);font-size:13px}
.c-sup{stroke:var(--up);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.c-res{stroke:var(--down);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.c-trend{stroke:var(--amber);stroke-width:2;fill:none}
.c-lead{stroke:var(--muted);stroke-width:1;fill:none}

/* quote card */
.quote{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.quote-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px}
.quote-top h4{font-size:19px}
.quote .px{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;direction:ltr}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.quote dl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0;border-top:1px solid var(--line)}
.quote dl div{padding:10px 14px;border-inline-start:1px solid var(--line)}
.quote dl div:first-child{border-inline-start:0}
.quote dt{font-size:12.5px;color:var(--muted)}
.quote dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir="rtl"] .quote dd{text-align:right}
@media (max-width:620px){.quote dl{grid-template-columns:repeat(2,minmax(0,1fr))}.quote dl div{border-top:1px solid var(--line)}.quote dl div:nth-child(odd){border-inline-start:0}}
.quote-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px}
.q legend,.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:7px;accent-color:var(--amber)}
.opt.right{border-color:var(--up);background:var(--up-soft)}
.opt.wrong{border-color:var(--down);background:var(--down-soft)}
.why{margin-top:10px;font-size:14.5px;color:var(--muted)}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* forms & tables */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field input.num{text-align:left}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--amber)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.note{white-space:normal;min-width:180px;max-width:280px}
td .num,td.num{font-size:13.5px}
.pos{color:var(--up)} .neg{color:var(--down)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stats div{padding:14px 16px;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats span{display:block;font-size:12.5px;color:var(--muted)}
.stats b{font-family:var(--mono);font-size:22px;direction:ltr;unicode-bidi:isolate}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-inline-start:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.result{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 24px}
.result span{font-size:13px;color:var(--muted);display:block}
.result b{font-family:var(--mono);font-size:19px;direction:ltr;unicode-bidi:isolate}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.gloss div{padding-block:12px;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:600;font-family:var(--display);font-size:17px}
.gloss dt small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:8px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:15px}
@media (max-width:720px){.gloss{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;gap:14px}
.plan .price{font-family:var(--mono);font-size:34px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.plan ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.plan.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.plan .btn{margin-top:auto}
.testcard{font-family:var(--mono);background:var(--navy);color:var(--navy-fg);border-radius:var(--r);padding:16px;direction:ltr;text-align:left;max-width:340px}
.testcard small{color:var(--navy-muted);display:block}
.foot{border-top:1px solid var(--line);margin-top:40px}
.foot .wrap{padding-block:22px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:13.5px;color:var(--muted)}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast span{background:var(--navy);color:var(--navy-fg);padding:9px 18px;border-radius:99px;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.step{transition:background .2s,border-color .2s}}
</style>
<header class="top" id="top"></header><main id="main"></main><footer class="foot" id="foot"></footer><div id="toast" hidden role="status" aria-live="polite"></div>

<script>
/* ===== محتوى مِراس: كل نص زوج [عربي, English] ===== */

/* أسعار نموذجية للتدريب. تُستبدل بملف prices.json من سهمك بعد ربط المفتاح. */
const SAMPLE_QUOTES = {

  "1120": { name: ["مصرف الراجحي", "Al Rajhi Bank"], price: 96.40, prev: 97.10, open: 97.00, high: 97.30, low: 96.10, volume: 3412550 },
  "2010": { name: ["سابك", "SABIC"], price: 61.80, prev: 61.20, open: 61.30, high: 62.10, low: 61.10, volume: 1876320 },
  "7010": { name: ["اس تي سي", "stc"], price: 42.15, prev: 42.00, open: 42.05, high: 42.40, low: 41.90, volume: 2954100 },

  { id: "dev-2-1", track: "dev", level: 2, mins: 8, title: ["سعر سهم بـ Python", "A share price in Python"],
    body: [

      { code: "import os\nimport requests\n\nAPI_KEY = os.environ[\"SAHMK_API_KEY\"]   # read the key from the environment\nBASE_URL = \"https://api.sahmk.sa/api/v1\"\n\ndef get_quote(symbol):\n    r = requests.get(\n        f\"{BASE_URL}/quote/{symbol}/\",\n        headers={\"X-API-Key\": API_KEY},\n        timeout=10,\n    )\n    r.raise_for_status()               # stop on 4xx / 5xx\n    return r.json()\n\nq = get_quote(\"2222\")\nprint(f\"{q['name_en']}: {q['price']} SAR ({q['change_percent']}%)\")", name: "quote.py" },

        ["raise_for_status يوقف السكربت بخطأ واضح بدل ما يكمل على بيانات ناقصة.", "raise_for_status stops the script with a clear error instead of continuing on missing data."]

  { id: "dev-2-2", track: "dev", level: 2, mins: 9, title: ["عدة أسهم مع احترام حد الطلبات", "Several shares within the rate limit"],
    body: [
      { p: ["عندك 100 طلب في اليوم. لو تتابع 8 أسهم وتحدّثها كل ساعة خلال جلسة من 5 ساعات، هذي 40 طلب. ولو شغّلت نفس السكربت كل 5 دقايق تخلص رصيدك قبل الظهر. فالحل إنك تسحب مرة وتخزن النتيجة في ملف، وكل شي ثاني يقرأ من الملف.", "You have 100 requests a day. Following 8 shares hourly over a 5-hour session is 40 requests. Run the same script every 5 minutes and you are out before noon. So fetch once, save the result to a file, and let everything else read from the file."] },
      { code: "import json, os, time\nfrom datetime import datetime\nimport requests\n\nAPI_KEY = os.environ[\"SAHMK_API_KEY\"]\nBASE_URL = \"https://api.sahmk.sa/api/v1\"\nWATCHLIST = [\"2222\", \"1120\", \"2010\", \"7010\"]\n\ndef fetch_all(symbols):\n    out = {}\n    for s in symbols:\n        r = requests.get(f\"{BASE_URL}/quote/{s}/\",\n                         headers={\"X-API-Key\": API_KEY}, timeout=10)\n        if r.status_code == 429:        # daily or per-minute limit reached\n            print(\"limit reached, stopping\")\n            break\n        r.raise_for_status()\n        out[s] = r.json()\n        time.sleep(1)                   # be gentle between requests\n    return out\n\ndata = {\n    \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\"),\n    \"quotes\": fetch_all(WATCHLIST),\n}\nwith open(\"prices.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False, indent=2)\n\nprint(f\"saved {len(data['quotes'])} quotes\")", name: "fetch_prices.py" },

      { ul: [
        ["كل تشغيل يكلف طلب واحد لكل سهم، فتعرف بالضبط كم تصرف.", "Each run costs one request per share, so you know exactly what you spend."],
        ["الملف prices.json فيه وقت السحب، فتعرف عمر البيانات.", "prices.json carries the fetch time, so you know how old the data is."],
        ["الرمز 429 هو الجواب المعتاد في أغلب الخدمات لما تتجاوز الحد، والسكربت يوقف عنده بدل ما يكرر.", "429 is the usual reply from most services when you exceed a limit, and the script stops there instead of retrying."]

    ],
    quiz: [
      { q: ["تتابع 10 أسهم وتبي تحدّثها كل نص ساعة لمدة 5 ساعات. كم طلب تحتاج؟", "You follow 10 shares and refresh every half hour for 5 hours. How many requests?"],

        opts: [["عشان بقية الأدوات تقرأ منه بدون ما تصرف طلبات", "So other tools read from it without spending requests"], ["عشان تزيد دقة السعر", "To make the price more accurate"], ["عشان نخفي المفتاح", "To hide the key"]], a: 0,

async function saveFile(filename, blob) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl) {
    try { const r = await dl.save({ filename, data: blob }); if (r && r.status === "saved") toast(t("saved_file")); }
    catch (e) { if (!e || e.code !== "declined") toast(t("save_fail")); }
    return;
  }
  if (window.self !== window.top) { toast(t("save_fail")); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* deterministic sample series so charts never change between visits */
function series(kind) {
  let seed = kind === "trend" ? 7 : 21;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const out = []; let c = kind === "trend" ? 40 : 51;
  for (let i = 0; i < 36; i++) {
    let drift;
    if (kind === "trend") drift = 0.34 + Math.sin(i / 2.6) * 0.9;
    else drift = Math.cos(i / 2.9) * 1.15;
    const o = c; let cl = o + drift + (rnd() - 0.5) * 0.9;
    if (kind !== "trend") cl = Math.max(48.4, Math.min(53.6, cl));
    let h = Math.max(o, cl) + rnd() * 0.7, lo = Math.min(o, cl) - rnd() * 0.7;
    if (kind !== "trend") { h = Math.min(h, 54.1); lo = Math.max(lo, 47.9); }
    out.push({ o, h, l: lo, c: cl, v: 0.6 + rnd() * 0.9 + Math.abs(cl - o) * 0.5 }); c = cl;
  }
  return out;
}

function candleChart(kind) {
  const d = series(kind === "trend" ? "trend" : "range");
  const W = 640, H = 312, padL = 10, padR = 52, top = 14, ph = 200, vh = 46, vtop = top + ph + 30;
  let min = Math.min(...d.map((x) => x.l)), max = Math.max(...d.map((x) => x.h));
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const y = (v) => top + ((max - v) / (max - min)) * ph;
  const bw = (W - padL - padR) / d.length, x = (i) => padL + i * bw + bw / 2;
  const vmax = Math.max(...d.map((p) => p.v));
  let s = "";
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = min + ((max - min) * i) / ticks, yy = y(v);
    s += '<line class="c-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/><text class="c-text" x="' + (W - padR + 6) + '" y="' + (yy + 4) + '">' + v.toFixed(1) + "</text>";
  }
  d.forEach((p, i) => {
    const cls = p.c >= p.o ? "c-up" : "c-down", bt = y(Math.max(p.o, p.c)), bb = y(Math.min(p.o, p.c));
    s += '<line class="' + cls + '" x1="' + x(i) + '" x2="' + x(i) + '" y1="' + y(p.h) + '" y2="' + y(p.l) + '" stroke-width="1.4"/>' +
      '<rect class="' + cls + '" x="' + (x(i) - bw * 0.32) + '" y="' + bt + '" width="' + bw * 0.64 + '" height="' + Math.max(1.5, bb - bt) + '"/>' +
      '<rect class="' + cls + '" opacity=".45" x="' + (x(i) - bw * 0.32) + '" y="' + (vtop + vh - (p.v / vmax) * vh) + '" width="' + bw * 0.64 + '" height="' + (p.v / vmax) * vh + '"/>';
  });

  }
  if (kind === "trend") {
    /* trend line through the two lowest swing lows of each half */
    const lowIdx = (a, b) => { let k = a; for (let i = a; i < b; i++) if (d[i].l < d[k].l) k = i; return k; };
    const i1 = lowIdx(0, 12), i2 = lowIdx(14, 28), m = (d[i2].l - d[i1].l) / (i2 - i1);
    const yAt = (i) => d[i1].l + m * (i - i1) - 0.25;
    s += '<line class="c-trend" x1="' + x(0) + '" y1="' + y(yAt(0)) + '" x2="' + x(d.length - 1) + '" y2="' + y(yAt(d.length - 1)) + '"/>';
  }
  s += '<text class="c-text" x="' + padL + '" y="' + (vtop - 4) + '">' + esc(L(["الحجم", "Volume"])) + "</text>";
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img">' + s + "</svg>";
}

  return svcShell("calc", '<div class="grid2">' +

    card("c_size", '<div class="form-grid">' + inp("s-cap", "capital", 50000) + inp("s-risk", "riskpct", 1) + inp("s-entry", "entry", 50) + inp("s-stop", "stop", 48) + "</div>", "o-size") +

function runCalc() {
  const v = (id) => { const el = document.getElementById(id); return el ? parseFloat(el.value) || 0 : 0; };
  const out = (id, pairs) => { const el = document.getElementById(id); if (el) el.innerHTML = pairs.map(([k, val, cls]) => "<div><span>" + esc(t(k)) + '</span><b class="' + (cls || "") + '">' + val + "</b></div>").join(""); };
  if (!document.getElementById("o-avg")) return;
  let q = 0, cost = 0; [0, 1, 2].forEach((i) => { q += v("a-q" + i); cost += v("a-q" + i) * v("a-p" + i); });
  out("o-avg", [["r_avg", q ? fmt(cost / q, 3) : "–"], ["r_shares", int(q)], ["r_total", fmt(cost)]]);
  const b = v("r-buy"), s = v("r-sell"), rq = v("r-qty"), dv = v("r-div"), profit = (s - b + dv) * rq, ret = b ? ((s - b + dv) / b) * 100 : 0;
  out("o-ret", [["r_profit", (profit > 0 ? "+" : "") + fmt(profit), profit > 0 ? "pos" : profit < 0 ? "neg" : ""], ["r_ret", (ret > 0 ? "+" : "") + fmt(ret) + "%", ret > 0 ? "pos" : ret < 0 ? "neg" : ""]]);
  const cap = v("s-cap"), rp = v("s-risk"), en = v("s-entry"), st = v("s-stop"), risk = (cap * rp) / 100, per = en - st, size = per > 0 ? Math.floor(risk / per) : 0;
  out("o-size", [["r_size", per > 0 ? int(size) : "–"], ["r_value", per > 0 ? fmt(size * en) : "–"], ["r_risk", fmt(risk)]]);
  out("o-zak", [["r_zak", fmt(v("z-mv") * (parseFloat((document.getElementById("z-year") || {}).value) || 0.025))]]);
}

const b64e = (s) => { const b = new TextEncoder().encode(s); let o = ""; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
const b64d = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

async function gh(path, method, body) {
  let r;
  try {
    r = await fetch("https://api.github.com/repos/" + encodeURIComponent(CFG.owner) + "/" + encodeURIComponent(CFG.repo) + "/contents/" + path + (method ? "" : "?t=" + Date.now()), {
      method: method || "GET", cache: "no-store",
      headers: { Authorization: "Bearer " + CFG.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw { code: "net" }; }
  if (r.status === 404 && !method) return null;
  if (!r.ok) throw { code: String(r.status) };
  return r.json();
}
async function readJson(path) {
  const f = await gh(path); if (!f) return null;
  try { return { data: JSON.parse(b64d(f.content)), sha: f.sha }; } catch (e) { return { data: null, sha: f.sha }; }
}
const errText = (e) => t({ "401": "e_401", "404": "e_404", "403": "e_403", net: "e_net" }[e && e.code] || "e_net");

/* ما يتزامن: التقدم، السجل، الباقة، الحساب. اللغة وحالة الدخول تبقى لكل جهاز. */
const shared = (s) => JSON.stringify({ a: s.account, p: s.plan, d: Object.keys(s.done).sort().map((k) => [k, s.done[k]]), j: s.journal, x: (s.deleted || []).slice().sort() });
function mergeState(local, remote) {
  if (!remote || typeof remote !== "object") return local;
  const newer = (local.updatedAt || 0) >= (remote.updatedAt || 0) ? local : remote;
  const out = Object.assign(blank(), newer, { lang: local.lang, signedIn: local.signedIn });
  out.done = Object.assign({}, remote.done || {}, local.done || {});
  out.deleted = Array.from(new Set([].concat(local.deleted || [], remote.deleted || [])));
  const byId = {};
  [].concat(remote.journal || [], local.journal || []).forEach((j) => { const p = byId[j.id]; if (!p || (j.updated || 0) >= (p.updated || 0)) byId[j.id] = j; });
  out.journal = Object.values(byId).filter((j) => !out.deleted.includes(j.id)).sort((a, b) => (a.entryDate + a.id < b.entryDate + b.id ? -1 : 1));
  if (!out.account && (remote.account || local.account)) out.account = local.account || remote.account;
  return out;
}

let syncing = false, again = false, timer = null;
async function syncNow(quiet) {
  if (!HOSTED || !CFG.token) return false;
  if (syncing) { again = true; return false; }
  syncing = true; SYNC.state = "busy"; paintStatus();
  let ok = false;
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      const remote = await readJson("state.json");
      const merged = mergeState(S, remote && remote.data && remote.data.state);
      const changedLocal = shared(merged) !== shared(S);
      S = merged; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if (changedLocal && route() !== "settings") render();
      if (remote && remote.data && remote.data.state && shared(remote.data.state) === shared(S)) { ok = true; break; }
      try {
        const copy = Object.assign({}, S); delete copy.signedIn;
        await gh("state.json", "PUT", { message: "sync " + new Date().toISOString(), content: b64e(JSON.stringify({ app: "meras", version: 1, state: copy }, null, 2)), sha: remote ? remote.sha : undefined });
        ok = true; break;
      } catch (e) { if (attempt === 0 && e && (e.code === "409" || e.code === "422")) continue; throw e; }
    }
    SYNC = { state: "ok", at: Date.now(), msg: "" };
    if (!quiet) toast(t("synced"));
  } catch (e) { SYNC = { state: "err", at: SYNC.at, msg: errText(e) }; if (!quiet) toast(SYNC.msg); }
  syncing = false; paintStatus();
  if (again) { again = false; queueSync(); }
  return ok;
}
function queueSync() { if (!HOSTED || !CFG.token) return; clearTimeout(timer); timer = setTimeout(() => syncNow(true), 3500); }

async function loadPrices(quiet) {
  if (!HOSTED || !CFG.token) return;
  try {
    const f = await readJson("prices.json");
    if (!f || !f.data || !f.data.quotes) { if (!quiet) toast(t("no_prices")); return; }
    LIVE = { quotes: f.data.quotes, fetchedAt: f.data.fetched_at || null };
    try { localStorage.setItem(PX_KEY, JSON.stringify(LIVE)); } catch (e) {}
    if (!quiet) toast(t("px_ok"));
    if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
  } catch (e) { if (!quiet) toast(errText(e)); }
}

const numOr = (v) => (typeof v === "number" && isFinite(v) ? v : null);
function quoteOf(symbol) {
  const s = SAMPLE_QUOTES[symbol], l = LIVE.quotes && LIVE.quotes[symbol];
  if (!l || numOr(l.price) == null) return s ? Object.assign({ live: false }, s) : null;
  const prev = numOr(l.previous_close) ?? numOr(l.prev_close) ?? (numOr(l.change) != null ? l.price - l.change : null);
  return { live: true, delayed: l.is_delayed !== false, name: [l.name || (s ? s.name[0] : symbol), l.name_en || (s ? s.name[1] : symbol)], price: l.price, prev, open: numOr(l.open), high: numOr(l.high), low: numOr(l.low), volume: numOr(l.volume) };
}
const whenText = (ts) => { if (!ts) return t("never"); const d = new Date(ts); if (isNaN(d)) return String(ts); const z = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes()); };
const whenHtml = (ts) => (ts ? '<span class="num">' + esc(whenText(ts)) + "</span>" : esc(t("never")));

function statusHtml() {
  const st = !CFG.token ? "off" : SYNC.state === "off" ? "ok" : SYNC.state;
  const cls = st === "ok" ? "up" : st === "err" ? "down" : st === "busy" ? "amber" : "";
  return '<div><span>' + esc(t("set_status")) + '</span><b style="font-family:var(--body);font-size:15px"><span class="tag ' + cls + '">' + esc(t("st_" + st)) + "</span>" + (st === "err" ? ' <span class="small muted">' + esc(SYNC.msg) + "</span>" : "") + "</b></div><div><span>" + esc(t("set_last")) + '</span><b style="font-family:var(--body);font-size:15px">' + whenHtml(SYNC.at) + "</b></div><div><span>" + esc(t("set_px")) + '</span><b style="font-family:var(--body);font-size:15px">' + whenHtml(LIVE.fetchedAt) + "</b></div>";
}
function paintStatus() { const el = document.getElementById("sync-status"); if (el) el.innerHTML = statusHtml(); }

function pageSettings() {
  const head = '<div class="wrap"><div class="page-head"><h1>' + esc(t("set_h")) + "</h1><p>" + esc(t("set_p")) + '</p></div><div class="stack" style="padding-block:18px;max-width:640px">';
  if (!HOSTED) return head + '<div class="notice">' + esc(t("set_only_hosted")) + "</div></div></div>";
  const f = (id, k, val, extra) => '<div class="field"><label for="' + id + '">' + esc(t(k)) + '</label><input id="' + id + '" dir="ltr" ' + (extra || "") + ' value="' + esc(val) + '"></div>';
  return head + '<div class="result" id="sync-status">' + statusHtml() + '</div><form class="panel stack" data-form="sync" novalidate><div class="form-grid">' + f("s-owner", "set_owner", CFG.owner, 'autocomplete="off"') + f("s-repo", "set_repo", CFG.repo, 'autocomplete="off"') + "</div>" + f("s-token", "set_token", CFG.token, 'type="password" autocomplete="off" spellcheck="false"') + '<p class="small muted">' + esc(t("set_token_note")) + '</p><div class="row"><button class="btn primary" type="submit">' + esc(t("set_save")) + "</button>" + (CFG.token ? '<button class="btn" type="button" data-act="sync-now">' + esc(t("set_sync")) + '</button><button class="btn" type="button" data-act="px-now">' + esc(t("set_prices")) + '</button><button class="btn ghost" type="button" data-act="sync-forget">' + esc(t("set_forget")) + "</button>" : "") + '</div></form><div class="panel stack"><h3>' + esc(t("set_how")) + '</h3><ol style="margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px">' + UI.set_steps.map((s) => "<li>" + esc(L(s)) + "</li>").join("") + "</ol></div></div></div>";
}

document.addEventListener("submit", async (e) => {
  const form = e.target.closest('[data-form="sync"]'); if (!form) return;
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  CFG = { owner: v("s-owner"), repo: v("s-repo"), token: v("s-token") };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (err) {}
  if (!CFG.token) { render(); return; }
  if (await syncNow(false)) { await loadPrices(true); }
  render();
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "sync-now") syncNow(false);
  else if (el.dataset.act === "px-now") loadPrices(false);
  else if (el.dataset.act === "sync-forget") { CFG.token = ""; try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (err) {} SYNC = { state: "off", at: null, msg: "" }; render(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && CFG.token) { syncNow(true); loadPrices(true); } });
/* ===== التشغيل ===== */
lastRoute = route();
render();
if (HOSTED && CFG.token) { syncNow(true).then(() => loadPrices(true)); }
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
