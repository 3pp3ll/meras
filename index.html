<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مِراس</title>
<meta name="description" content="مِراس: منصة تعليمية للسوق المالية السعودية. مسارات للمستثمر والمتداول والمبرمج.">
<meta name="theme-color" content="#FFE2D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مِراس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: the مدرج (staircase) is the spine. Day is a soft peach, pink and sky blend; night is the navy staircase, with a dimmer the reader controls (--dk). */
:root{
  --dk:.5;
  --bg:#FFF6F1; --surface:#FFFFFF; --sunk:#FCEEF1;
  --ink:#2F3A4F; --muted:#6E7A8E; --line:#F0DEDB;
  --navy:#DDF0FA; --navy-fg:#24324A; --navy-muted:#5D6D85; --navy-line:#B9DCEF;
  --hero-bg:linear-gradient(115deg,#FFE2D2 0%,#FCE0EA 50%,#D6EDFA 100%);
  --glow:radial-gradient(900px 420px at 92% -8%,#FCE3EC 0%,transparent 62%),radial-gradient(800px 420px at 0% 0%,#E2F2FB 0%,transparent 58%);
  --amber:#F4A37F; --amber-ink:#B4532E; --amber-soft:#FFE9DE; --on-amber:#3A1D10;
  --sky:#7DC3E6; --sky-soft:#E4F4FC; --pink:#F2A7C0; --pink-soft:#FDEBF1;
  --up:#2E9C73; --up-soft:#E2F5EC; --down:#D9534F; --down-soft:#FCE6E6;
  --code-bg:#2F3A4F; --code-fg:#EEF3FA;
  --ind1:#D9822B; --ind2:#3C8CC9; --ind3:#B05FC9; --ind4:#1E9E9E; --ind5:#C2410C; --draw:#2F3A4F;
  --display:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"Calibri","Carlito","IBM Plex Sans Arabic",system-ui,sans-serif;
  --code:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --gap:16px; --wrap:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(220 60% calc(4% + var(--dk) * 12%)); --surface:hsl(220 55% calc(9% + var(--dk) * 12%)); --sunk:hsl(220 58% calc(6% + var(--dk) * 12%));
    --ink:#E8EDF8; --muted:#97A6C4; --line:hsl(220 42% calc(19% + var(--dk) * 12%));
    --navy:hsl(220 57% calc(14% + var(--dk) * 12%)); --navy-fg:#EEF2FA; --navy-muted:#A9B7D4; --navy-line:hsl(222 46% calc(27% + var(--dk) * 12%));
    --hero-bg:var(--navy); --glow:none;
    --amber:#F0A93A; --amber-ink:#F3B75A; --amber-soft:hsl(40 60% calc(8% + var(--dk) * 10%)); --on-amber:#1A1300;
    --sky:#7FB0FF; --sky-soft:hsl(210 50% calc(10% + var(--dk) * 10%)); --pink:#F2A7C0; --pink-soft:hsl(335 35% calc(10% + var(--dk) * 10%));
    --up:#3FCB96; --up-soft:hsl(158 50% calc(8% + var(--dk) * 10%)); --down:#F27C72; --down-soft:hsl(5 45% calc(10% + var(--dk) * 10%));
    --code-bg:hsl(220 60% calc(3% + var(--dk) * 8%)); --code-fg:#DCE6FA;
    --ind1:#F0A93A; --ind2:#7FB0FF; --ind3:#C59BF7; --ind4:#4FD1C5; --ind5:#FB923C; --draw:#E8EDF8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:hsl(220 60% calc(4% + var(--dk) * 12%)); --surface:hsl(220 55% calc(9% + var(--dk) * 12%)); --sunk:hsl(220 58% calc(6% + var(--dk) * 12%));
    --ink:#E8EDF8; --muted:#97A6C4; --line:hsl(220 42% calc(19% + var(--dk) * 12%));
    --navy:hsl(220 57% calc(14% + var(--dk) * 12%)); --navy-fg:#EEF2FA; --navy-muted:#A9B7D4; --navy-line:hsl(222 46% calc(27% + var(--dk) * 12%));
    --hero-bg:var(--navy); --glow:none;
    --amber:#F0A93A; --amber-ink:#F3B75A; --amber-soft:hsl(40 60% calc(8% + var(--dk) * 10%)); --on-amber:#1A1300;
    --sky:#7FB0FF; --sky-soft:hsl(210 50% calc(10% + var(--dk) * 10%)); --pink:#F2A7C0; --pink-soft:hsl(335 35% calc(10% + var(--dk) * 10%));
    --up:#3FCB96; --up-soft:hsl(158 50% calc(8% + var(--dk) * 10%)); --down:#F27C72; --down-soft:hsl(5 45% calc(10% + var(--dk) * 10%));
    --code-bg:hsl(220 60% calc(3% + var(--dk) * 8%)); --code-fg:#DCE6FA;
    --ind1:#F0A93A; --ind2:#7FB0FF; --ind3:#C59BF7; --ind4:#4FD1C5; --ind5:#FB923C; --draw:#E8EDF8;
    color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.8}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:15px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:24px;font-weight:700}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:16.5px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber);border-radius:8px 8px 0 0}
.tools{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.nav{order:3;flex-basis:100%}.tools{margin-inline-start:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600;font-size:16.5px;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:15px}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{background:var(--hero-bg);color:var(--navy-fg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:52px 0}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:700;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--amber-ink)}
.hero p.lead{color:var(--navy-muted);font-size:19px;max-width:46ch;margin-block:16px 24px}
.hero .copy{padding-bottom:52px}
.hero .btn.ghost{color:var(--navy-fg);border-color:var(--navy-line)}
.eyebrow{font-size:14.5px;letter-spacing:.04em;color:var(--amber-ink);font-weight:600;margin-bottom:10px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:8px;padding-top:36px}.hero .copy{padding-bottom:24px}}

/* the staircase */
.stairs{display:flex;align-items:flex-end;gap:5px}
.step{flex:1;min-width:0;height:calc(34px + var(--n)*30px);border-radius:6px 6px 0 0;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1px solid var(--line);border-bottom:0;background:var(--surface);color:var(--muted);font-size:14px;line-height:1.35;text-decoration:none}
.step b{font-family:var(--mono);font-size:18px;color:var(--ink)}
.step.free{border-color:var(--amber)}
.step.free b{color:var(--amber-ink)}
.step.done{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.step.done b{color:var(--on-amber)}
.step.locked{border-style:dashed;background:transparent}
.hero .step{background:transparent;border-color:var(--navy-line);color:var(--navy-muted)}
.hero .step b{color:var(--navy-fg)}
.hero .step.free{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.hero .step.free b{color:var(--on-amber)}
.hero .stairs{gap:6px}
.hero .step{height:calc(46px + var(--n)*40px);font-size:14.5px}
@media (max-width:820px){.hero .step{height:calc(40px + var(--n)*22px)}}

/* sections */
main{display:block;min-height:60vh}
.sec{padding-block:44px}
.sec + .sec{padding-top:8px}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.sec-head h2{font-size:28px}
.sec-head p{color:var(--muted);max-width:62ch}
.page-head{padding-block:34px 6px}
.page-head h1{font-size:34px}
.page-head p{color:var(--muted);max-width:64ch;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media (max-width:820px){.grid3,.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel h3{font-size:21px}
.track-card{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.track-card:hover{border-color:var(--amber)}
.track-card .who{font-size:14.5px;color:var(--amber-ink);font-weight:600}
.track-card .meter{margin-top:auto}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);border-radius:3px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.flow > div{padding:18px;border-inline-start:1px solid var(--line)}
.flow > div:first-child{border-inline-start:0}
.flow .k{font-family:var(--mono);color:var(--amber-ink);font-size:14.5px}
.flow h4{font-size:18px;margin-block:2px 4px}
@media (max-width:820px){.flow{grid-template-columns:1fr 1fr}.flow > div:nth-child(3){border-inline-start:0}.flow > div:nth-child(n+3){border-top:1px solid var(--line)}}
.notice{border:1px dashed var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:12px 16px;font-size:16px}
.tag{display:inline-block;font-size:13.5px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tag.up{background:var(--up-soft);color:var(--up)}
.tag.down{background:var(--down-soft);color:var(--down)}

/* tracks page */
.track{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;padding-block:28px;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0}
@media (max-width:820px){.track{grid-template-columns:1fr}}
.levels{display:flex;flex-direction:column;gap:10px}
.level{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.level.locked{background:transparent;border-style:dashed}
.level-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.level-head b{font-family:var(--mono);color:var(--amber-ink)}
.level-head h4{font-size:18px;flex:1;min-width:0}
.lessons{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;text-decoration:none}
.lessons a:hover{background:var(--sunk)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12.5px;line-height:1}
.dot.done{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:760px;padding-block:28px 56px}
.crumbs{font-size:15px;color:var(--muted)}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.lesson h1{font-size:34px}
.prose{display:flex;flex-direction:column;gap:14px;font-size:18px}
.prose h3{font-size:21px;margin-top:10px}
.prose ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.prose code{font-family:var(--code);font-size:.88em;background:var(--sunk);padding:1px 6px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.code{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);direction:ltr;text-align:left}
.code pre{margin:0;padding:16px;overflow-x:auto;font-family:var(--code);font-size:15px;line-height:1.65}
.code .cap{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;font-family:var(--mono);font-size:13.5px;color:var(--navy-muted);border-bottom:1px solid var(--navy-line)}
.code .cap button{background:transparent;border:1px solid var(--navy-line);color:var(--code-fg);border-radius:6px;padding:2px 10px;font-size:13.5px;cursor:pointer}
.figure{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;overflow-x:auto}
.figure svg{display:block;width:100%;min-width:480px;height:auto;direction:ltr}
.figure figcaption,.figcap{font-size:15px;color:var(--muted);margin-top:8px}
figure{margin:0}
.c-up{fill:var(--up);stroke:var(--up)} .c-down{fill:var(--down);stroke:var(--down)}
.c-grid{stroke:var(--line);stroke-width:1} .c-text{fill:var(--muted);font-family:var(--mono);font-size:12.5px}
.c-label{fill:var(--ink);font-family:var(--body);font-size:14.5px}
.c-sup{stroke:var(--up);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.c-res{stroke:var(--down);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.c-trend{stroke:var(--amber);stroke-width:2;fill:none}
.c-lead{stroke:var(--muted);stroke-width:1;fill:none}

/* quote card */
.quote{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.quote-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:16px}
.quote-top h4{font-size:20px}
.quote .px{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;direction:ltr}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.quote dl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0;border-top:1px solid var(--line)}
.quote dl div{padding:10px 14px;border-inline-start:1px solid var(--line)}
.quote dl div:first-child{border-inline-start:0}
.quote dt{font-size:14px;color:var(--muted)}
.quote dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir="rtl"] .quote dd{text-align:right}
@media (max-width:620px){.quote dl{grid-template-columns:repeat(2,minmax(0,1fr))}.quote dl div{border-top:1px solid var(--line)}.quote dl div:nth-child(odd){border-inline-start:0}}
.quote-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px}
.q legend,.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:7px;accent-color:var(--amber)}
.opt.right{border-color:var(--up);background:var(--up-soft)}
.opt.wrong{border-color:var(--down);background:var(--down-soft)}
.why{margin-top:10px;font-size:16px;color:var(--muted)}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* forms & tables */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:15px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field input.num{text-align:left}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--amber)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:14px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.note{white-space:normal;min-width:180px;max-width:280px}
td .num,td.num{font-size:15px}
.pos{color:var(--up)} .neg{color:var(--down)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stats div{padding:14px 16px;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats span{display:block;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--mono);font-size:22px;direction:ltr;unicode-bidi:isolate}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-inline-start:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.result{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 24px}
.result span{font-size:14.5px;color:var(--muted);display:block}
.result b{font-family:var(--mono);font-size:20px;direction:ltr;unicode-bidi:isolate}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.gloss div{padding-block:12px;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:600;font-family:var(--display);font-size:18px}
.gloss dt small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:14px;margin:0 8px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:16.5px}
@media (max-width:720px){.gloss{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;gap:14px}
.plan .price{font-family:var(--mono);font-size:34px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.plan ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.plan.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.plan .btn{margin-top:auto}
.testcard{font-family:var(--code);background:var(--navy);color:var(--navy-fg);border-radius:var(--r);padding:16px;direction:ltr;text-align:left;max-width:340px}

/* chart */
.chartbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 10px 4px}
.chartbox svg,.ch-fullscreen svg{display:block;max-width:100%;height:auto;direction:ltr;touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}

.ch-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ch-top .ch-read{flex:1;min-width:0}
.ch-fullscreen{position:fixed;inset:0;z-index:40;background:var(--surface);padding:calc(6px + env(safe-area-inset-top,0px)) 8px 8px;overflow:auto}

.ch-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:4px}

.reading h3{font-size:20px;display:flex;gap:8px;align-items:center;color:var(--ink)}

.rdlist{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.rdlist > div{padding-block:10px;border-top:1px solid var(--line)}

.rdlist dd{margin:2px 0 0;font-size:16.5px;display:flex;flex-direction:column;gap:4px}
@media (max-width:720px){.rdlist{grid-template-columns:1fr}}
.draw.auto{stroke:var(--ind3)} .draw-dot.auto{fill:var(--ind3)} .draw-tag.auto{fill:var(--ind3)}
/* guides */
.guide-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;align-items:flex-start}
.guide-card:hover{border-color:var(--amber)}
.guide-card h3{font-size:22px}
.guide-thumb{align-self:stretch;background:var(--sunk);border-radius:8px;padding:10px}
.guide-thumb svg,.gs-fig svg{display:block;width:100%;height:auto;direction:ltr}
.guide-head{padding-block:34px 18px;max-width:720px}
.guide-head h1{font-size:clamp(30px,5vw,44px);margin-block:8px 10px}
.guide-head p{font-size:19px;color:var(--muted)}
.guide-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.guide-steps li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:34px;border-top:1px solid var(--line)}
.guide-steps li:nth-child(even) .gs-text{order:2}
.gs-n{display:block;font-size:54px;font-weight:600;line-height:1;color:var(--amber);margin-bottom:10px}
.gs-text h2{font-size:25px;margin-bottom:8px}
.gs-text p{font-size:18px;color:var(--muted);max-width:52ch}
.gs-fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
@media (max-width:820px){.guide-steps li{grid-template-columns:1fr;gap:16px;padding-block:26px}.guide-steps li:nth-child(even) .gs-text{order:0}.gs-n{font-size:42px}}
.mock{display:flex;flex-direction:column}
.mock > div{display:flex;justify-content:space-between;gap:16px;padding:10px 4px;border-bottom:1px solid var(--line)}
.mock > div:last-child{border-bottom:0}
.mock span{color:var(--muted);font-size:16px}
.mock b{font-weight:600;font-size:16.5px;font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.mock .pos b{color:var(--up)}
.ch-read{font-size:14.5px;line-height:1.9;min-height:25px;padding-inline:4px;display:flex;flex-wrap:wrap;gap:0 14px}
.c-lab{fill:var(--muted);font-family:var(--body);font-size:13.5px}
.ch-read b{font-weight:600}
.rd{white-space:nowrap}
.rd.i1{color:var(--ind1)} .rd.i2{color:var(--ind2)} .rd.i3{color:var(--ind3)}
.ind{fill:none;stroke-width:1.8;stroke-linejoin:round}
.ind.i1{stroke:var(--ind1)} .ind.i2{stroke:var(--ind2)} .ind.i3{stroke:var(--ind3)}
.draw{stroke:var(--draw);stroke-width:1.4;stroke-dasharray:7 4;fill:none}
.draw-dot{fill:var(--draw);stroke:none}
.draw-tag{fill:var(--draw);stroke:none}
.draw-txt{fill:var(--surface);font-family:var(--mono);font-size:12.5px}
.cross{stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3;pointer-events:none}
.pane{fill:var(--sunk);stroke:none;opacity:.6}
.indbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:15px;cursor:pointer;background:var(--surface)}
.indbox input[type="checkbox"]{accent-color:var(--amber)}
.indbox input[type="number"]{width:54px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg);font-size:14.5px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.sw.i1{background:var(--ind1)} .sw.i2{background:var(--ind2)} .sw.i3{background:var(--ind3)}
.btn.on{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:15px}
[dir="rtl"] .chip{padding:2px 10px 2px 4px}
.chip button{border:0;background:var(--sunk);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1;font-size:16.5px}
.rdlist > div.wide{grid-column:1/-1}
.ai-box{border-top:1px solid var(--line);padding-top:14px}
.ai-box input{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ai-box .btn svg{flex:none}
.ai-out{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:17px}
.fib{stroke:var(--ind1);stroke-width:1;stroke-dasharray:2 3;fill:none}
.fib.key{stroke-width:1.6;stroke-dasharray:none}
.fib-txt{fill:var(--ind1);font-family:var(--mono);font-size:10.5px}
.ch-bar{flex-wrap:nowrap}
.ch-bar > b{white-space:nowrap;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
.ch-bar-scroll{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.ch-bar-scroll::-webkit-scrollbar{display:none}
.ch-bar-scroll .btn,.ch-bar > .btn{white-space:nowrap;flex:none}
.ch-bar .sep{width:1px;height:22px;background:var(--line);flex:none}
.btn.tgl.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
/* indicator library */
.lib{display:flex;flex-direction:column}
.lib > section{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;padding-block:34px;border-top:1px solid var(--line);align-items:start}
.lib h2{font-size:27px;margin-block:6px 10px}
.lib h2 small{font-family:var(--mono);font-weight:400;font-size:15.5px;color:var(--muted);margin-inline-start:8px}
.lib dl{margin:0;display:flex;flex-direction:column;gap:12px}
.lib dt{font-size:14px;font-weight:600;color:var(--amber-ink)}
.lib dd{margin:2px 0 0;font-size:17px}
.lib .gs-fig{position:sticky;top:90px}
@media (max-width:820px){.lib > section{grid-template-columns:1fr;gap:16px}.lib .gs-fig{position:static}}
.prose-wide{max-width:70ch;display:flex;flex-direction:column;gap:12px;font-size:18px}
.prose-wide h2{font-size:25px;margin-top:8px}
.ind.i4{stroke:var(--ind4)} .rd.i4{color:var(--ind4)} .sw.i4{background:var(--ind4)}
.ind.thin{stroke-width:1.3} .ind.dash{stroke-width:1.1;stroke-dasharray:4 3}
.bb-band{fill:var(--ind4);opacity:.08;stroke:none}
.price-line{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.ohlc{fill:none;stroke-width:1.5}
.ch-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
@media (max-width:560px){.ch-grid{grid-template-columns:1fr 1fr}.ch-grid > .field:first-child{grid-column:1/-1}}
.indchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;font-size:15px;background:var(--surface)}
[dir="rtl"] .indchip{padding:3px 8px 3px 4px}
.indchip input{width:52px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg);font-size:14.5px}
.indchip button{border:0;background:var(--sunk);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1;font-size:16.5px}
.addsel{border:1px dashed var(--amber);border-radius:8px;padding:5px 8px;background:var(--amber-soft);color:var(--amber-ink);font-weight:600;font-size:15px}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px}
.ai-chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:14.5px;cursor:pointer}
.ai-chips button:hover{border-color:var(--amber)}
/* lab */
.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.lab-grid > div{border-top:2px solid var(--amber);padding-top:12px}
.lab-k{font-family:var(--display);font-size:18px}
@media (max-width:900px){.lab-grid{grid-template-columns:1fr}}
.lab-sum{font-size:18px;max-width:70ch}
.lab-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.lab-stats div:nth-child(n+5){border-top:1px solid var(--line)}
.lab-stats div:nth-child(5){border-inline-start:0}
@media (max-width:620px){.lab-stats{grid-template-columns:1fr 1fr}.lab-stats div:nth-child(odd){border-inline-start:0}.lab-stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.tr-win{fill:var(--up);opacity:.09} .tr-loss{fill:var(--down);opacity:.09}
.mk-in{fill:var(--ind2)} .mk-out.win{fill:var(--up)} .mk-out.loss{fill:var(--down)}
.lg-sw.i1{fill:var(--ind1)} .lg-sw.i2{fill:var(--ind2)}
.labfig svg{display:block;width:100%;height:auto;direction:ltr}
.fib.ext{stroke:var(--ind3);stroke-dasharray:6 3;stroke-width:1.2}
.fib-txt.ext{fill:var(--ind3)}
.fibbox{border-top:1px solid var(--line);padding-top:14px}
.fibbox h3{font-size:19px}
.fibtbl td,.fibtbl th{white-space:nowrap}
.fibtbl td.note{white-space:normal;min-width:220px}
.fibtbl tr.key td{background:var(--amber-soft)}
.fibtbl tr.ext td:first-child b{color:var(--ind3)}
.conf{background:var(--up-soft);border-radius:8px;padding:8px 12px;font-size:16px}.conf.mine{background:var(--sunk);color:var(--muted)}
/* dividends */
.dv-star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--amber);padding:2px 4px}
.dv-table tr.dv-soon td{background:var(--amber-soft)}
.dv-table tr.dv-month td:first-child{box-shadow:inset -3px 0 0 var(--amber)}
[dir="ltr"] .dv-table tr.dv-month td:first-child{box-shadow:inset 3px 0 0 var(--amber)}

/* تقرير التوزيعات للطباعة / PDF */
#dv-print{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body.printing{background:#fff!important;color:#0F1F3D!important}
  body.printing > *:not(#dv-print){display:none!important}
  body.printing #dv-print{display:block;font-family:var(--body);color:#0F1F3D}
  #dv-print header{border-bottom:2px solid #E09A1A;padding-bottom:8px;margin-bottom:10px}
  #dv-print .pr-brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:17px;font-weight:700}
  #dv-print .pr-brand svg{width:22px;height:22px}
  #dv-print h1{font-size:22px;margin:4px 0 2px}
  #dv-print header p{margin:0;color:#55637F;font-size:13px}
  #dv-print table{width:100%;border-collapse:collapse;font-size:10.5px}
  #dv-print th,#dv-print td{border:1px solid #D5DCE9;padding:4px 6px;text-align:start;vertical-align:top;white-space:normal;background:#fff;color:#0F1F3D}
  #dv-print th{background:#EEF1F7!important;font-weight:600;font-size:10px;color:#55637F}
  #dv-print tr{break-inside:avoid}
  #dv-print small{color:#55637F}
  #dv-print .pr-num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
  #dv-print .pr-notes{margin-top:10px;font-size:10px;color:#55637F;display:flex;flex-direction:column;gap:4px}
  #dv-print .pr-notes b{color:#0F1F3D}
  #dv-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
