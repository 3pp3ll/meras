async function ghApi(path, method, body) {
  let r;
  try {
    r = await fetch("https://api.github.com/repos/" + encodeURIComponent(CFG.owner) + "/" + encodeURIComponent(CFG.repo) + path, {
      method: method || "GET", cache: "no-store",
      headers: { Authorization: "Bearer " + CFG.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw { code: "net" }; }
  if (!r.ok) throw { code: String(r.status) };
  return r.status === 204 ? null : r.json();
}

async function loadOwner(force) {
  if (!HOSTED || !CFG.token || OW.loading || (OW.loaded && !force)) return;
  OW.loading = true; if (force) render();
  if (typeof loadUS === "function") await loadUS();
  const get = async (p) => { try { return await readJson(p); } catch (e) { return null; } };
  const [pr, te, dv, mt, ow, st, ...ls] = await Promise.all([get("prices.json"), get("technicals.json"), get("dividends.json"), get("metals.json"), get("owner.json"), gh("state.json").catch(() => null)].concat(OW_LISTS.map((x) => get(x[0]))));
  OW.files = { prices: pr && pr.data, technicals: te && te.data, dividends: dv && dv.data, metals: mt && mt.data, us: typeof US !== "undefined" ? US : null };
  OW_LISTS.forEach((x, i) => { OW.lists[x[0]] = { data: ls[i] && Array.isArray(ls[i].data) ? ls[i].data.map(String) : [], sha: ls[i] ? ls[i].sha : undefined }; });
  OW.own = (ow && ow.data) || { version: 1, users: [] }; if (!Array.isArray(OW.own.users)) OW.own.users = []; OW.ownSha = ow ? ow.sha : undefined;
  OW.stateSize = st ? st.size : null;
  try { const r = await ghApi("/actions/runs?per_page=50"); OW.runs = r.workflow_runs || []; OW.runsErr = null; } catch (e) { OW.runs = null; OW.runsErr = e.code; }
  OW.loading = false; OW.loaded = true;
  if (route() === "owner") render();
}

/* ----- vault: PBKDF2 + AES-GCM, all on the device ----- */
const u8b64 = (u) => btoa(String.fromCharCode.apply(null, u)), b64u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function vaultKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text))); return { iv: u8b64(iv), ct: u8b64(ct) }; }
async function unseal(key, box) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u8(box.iv) }, key, b64u8(box.ct)); return new TextDecoder().decode(pt); }

async function saveOwner() {
  OW.own.updatedAt = new Date().toISOString();
  try {
    const r = await gh("owner.json", "PUT", { message: "owner", content: b64e(JSON.stringify(OW.own, null, 1) + "\n"), sha: OW.ownSha });
    OW.ownSha = r && r.content ? r.content.sha : OW.ownSha; toast(t("ow_saved")); return true;
  } catch (e) { toast(e.code === "409" || e.code === "422" ? t("ow_conflict") : errText(e)); return false; }
}
async function saveList(file, next) {
  const cur = OW.lists[file];
  try {
    const r = await gh(file, "PUT", { message: file.replace(".json", ""), content: b64e(JSON.stringify(next) + "\n"), sha: cur.sha });
    OW.lists[file] = { data: next, sha: r && r.content ? r.content.sha : cur.sha }; toast(t("ow_saved"));
    if (file === "watchlist.json" && typeof WL !== "undefined") WL = next.slice();
    if (file === "divwatch.json" && typeof DIVW !== "undefined") DIVW = next.slice();
    if (file === "techlist.json" && typeof TECHL !== "undefined") TECHL = next.slice();
  } catch (e) { toast(e.code === "409" || e.code === "422" ? t("ow_conflict") : errText(e)); }
  render();
}
function owBackupFile() {
  const lists = {}; OW_LISTS.forEach(([f]) => { lists[f] = (OW.lists[f] || {}).data || []; });

document.addEventListener("submit", async (e) => {
  const form = e.target.closest && e.target.closest('[data-form^="ow-"]'); if (!form) return;
  e.preventDefault();
  const v = (id) => { const x = document.getElementById(id); return x ? x.value.trim() : ""; };
  const kind = form.dataset.form;
  if (kind === "ow-list") {
    const file = form.dataset.file, inp = form.querySelector("input"), s = inp.value.trim().replace(/\D/g, "");
    if (!/^\d{4}$/.test(s)) { toast(t("ow_bad_sym")); return; }
    const cur = OW.lists[file].data; if (cur.includes(s)) { toast(t("ow_dup")); return; }
    if (file === "watchlist.json" && cur.length >= WL_MAX) { toast(t("wl_full").replace("{n}", WL_MAX)); return; }
    saveList(file, cur.concat([s]));
  } else if (kind === "ow-user") {
    const name = v("ou-name"); if (!name) { toast(t("ow_u_need_name")); return; }
    const data = { keyMode: v("ou-keymode") || "own", orBudget: v("ou-budget") ? Number(v("ou-budget")) : null, name, contact: v("ou-contact"), plan: v("ou-plan"), status: v("ou-status"), start: v("ou-start"), end: v("ou-end"), amount: v("ou-amount") ? Number(v("ou-amount")) : null, note: v("ou-note") };
    const id = form.dataset.id;
    if (id) { const u = OW.own.users.find((x) => x.id === id); if (u) Object.assign(u, data); }
    else OW.own.users.push(Object.assign({ id: "u" + Date.now().toString(36), links: [], created: today() }, data));
    owAdding = false; owEdit = null; render(); await saveOwner(); render();
  } else if (kind === "ow-vault") {
    const p = v("ov-pass"), vault = OW.own.vault;
    if (p.length < 8) { toast(t("ow_v_short")); return; }
    try {
      if (!vault) {
        if (p !== v("ov-pass2")) { toast(t("ow_v_mismatch")); return; }
        const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 310000, key = await vaultKey(p, salt, iter);
        OW.own.vault = { kdf: "PBKDF2-SHA256", salt: u8b64(salt), iter, check: await seal(key, "meras-vault") };
        VAULT = key; render(); await saveOwner();
      } else {
        const key = await vaultKey(p, b64u8(vault.salt), vault.iter);
        if ((await unseal(key, vault.check)) !== "meras-vault") throw 0;
        VAULT = key; toast(t("ow_v_opened"));
      }
    } catch (err) { toast(t("ow_v_wrong")); return; }
    render();
  } else if (kind === "ow-key") {
    const id = form.dataset.id, u = OW.own.users.find((x) => x.id === id), platform = v("ok-p-" + id), key = v("ok-k-" + id);
    if (!u || !VAULT) return;
    if (!platform || !key) { toast(t("ow_k_need")); return; }
    const hint = key.length > 8 ? key.slice(0, 5) + "…" + key.slice(-3) : "••••";
    (u.links = u.links || []).push({ platform, hint, box: await seal(VAULT, key), added: today() });
    render(); await saveOwner(); render();
  }
});

    ["ex", "Call تنفيذه 190$، السهم 200$، العلاوة 13$: القيمة الذاتية 10$ والزمنية 3$. لو بقى السهم 200$ لين الانتهاء، العقد يصير 10$ بس، يعني الـ 3$ ذابت."],
    ["p", "**التذبذب (IV)** يرفع القيمة الزمنية. قبل إعلان النتائج المالية يرتفع IV، وبعد الإعلان ينهار حتى لو تحرك السهم. هذا اسمه **IV Crush**، وكثير من المبتدئين يشترون قبل النتائج ويخسرون رغم إن توقعهم صح."],
    ["q", "اشتريت Call قبل النتائج، والسهم طلع 2% بعدها، لكن العقد نزل. وش السبب الأرجح؟", ["خطأ في التطبيق", "انهيار التذبذب الضمني (IV Crush)", "العقد انتهى"], 1, "العلاوة كانت منفوخة بالتذبذب المتوقع. بعد الإعلان التذبذب نزل، وحركة 2% ما غطت النقص."]
  ] },
  { t: "5. الإغريقيات ببساطة", b: [
    ["ul", ["**Delta:** كم يتغير سعر العقد لما السهم يتحرك 1$. Delta 0.40 = العقد يتحرك 0.40$ (يعني 40$ للعقد). وكتقريب، هي احتمال تقريبي إن العقد ينتهي داخل السعر.", "**Theta:** كم يخسر العقد كل يوم من الوقت. Theta −0.05 = يخسر 5$ باليوم للعقد. المشتري يخسر الـ Theta، والبائع يكسبها.", "**Vega:** كم يتغير السعر لو التذبذب الضمني تغير نقطة وحدة.", "**Gamma:** كم تتغير الـ Delta نفسها. تكبر قرب الانتهاء، فالعقود القريبة تتقلب بعنف."]],
    ["p", "ما تحتاج تحسبها بنفسك، التطبيق يعرضها. المهم تفهم: **المشتري يحارب الوقت، والبائع يستفيد منه.**"],
    ["q", "عقد Delta حقه 0.30. السهم طلع 2$. كم تقريباً يتغير سعر العقد الواحد؟", ["0.30$", "60$", "200$"], 1, "0.30 × 2 = 0.60$ للسهم × 100 = 60$ تقريباً."]
  ] },
  { t: "6. شراء عقد خطوة بخطوة", b: [
    ["ol", ["**حدد الفكرة:** وش تتوقع؟ صعود (Call) أو نزول (Put)، ولين متى؟ بدون تاريخ واضح لا تشتري عقد.", "**اختر تاريخ أبعد من توقعك:** إذا تتوقع الحركة خلال 3 أسابيع، خذ عقد ينتهي بعد 45 إلى 60 يوم. الوقت الزايد يحميك من تآكل الوقت السريع.", "**اختر سعر التنفيذ:** للمبتدئ، عقد قريب من السعر أو داخله قليلاً (Delta بين 0.50 و 0.70). العقود البعيدة رخيصة لكن أغلبها ينتهي بدون قيمة.", "**افحص السيولة:** Open Interest عالي وفرق Bid/Ask ضيق.", "**حدد المبلغ:** العلاوة ممكن تروح كاملة. لا تحط في صفقة وحدة أكثر من 1 إلى 2% من محفظتك.", "**أدخل بأمر محدد** بين الـ Bid والـ Ask.", "**حدد الخروج قبل الدخول:** مثلاً تبيع لو ربح العقد 50 إلى 100%، أو لو خسر 50%، أو قبل الانتهاء بأسبوعين مهما كان.", "**اطلع قبل الانتهاء:** تبيع العقد نفسه في السوق، ما تحتاج تنفذ وتشتري الأسهم."]],
    ["warn", "إذا تركت عقد داخل السعر لين الانتهاء، الوسيط غالباً ينفذه تلقائياً، وتلقى نفسك تشتري 100 سهم وما عندك كاش كافي. بيع العقد قبلها."],
    ["q", "تتوقع السهم يطلع خلال شهر. أي عقد أنسب لمبتدئ؟", ["ينتهي هذا الأسبوع، بعيد عن السعر لأنه رخيص", "ينتهي بعد 45 إلى 60 يوم، قريب من السعر", "ينتهي بعد سنة، بعيد جداً"], 1, "وقت كافي لتحقق الفكرة، وDelta معقولة. العقد الرخيص القريب يحتاج حركة كبيرة وسريعة جداً."]
  ] },
  { t: "7. الجهة الثانية: بيع العقود وجمع العلاوة", b: [
    ["p", "كل عقد له مشتري وبائع. **البائع** (يسمونه كاتب العقد Writer) هو اللي ياخذ العلاوة من المشتري على طول، ومقابلها يلتزم: يبيع السهم بسعر التنفيذ (لو باع Call) أو يشتريه (لو باع Put) إذا طلب المشتري."],
    ["p", "هذا اللي كثير من الدورات تسميه \"اكسب من عمولة المتداولين\". هي مو عمولة، هي **العلاوة** اللي يدفعها المشتري. والفكرة إن القيمة الزمنية تذوب كل يوم لصالح البائع."],
    ["ul", ["**ربح البائع محدود:** أعلى شي ياخذه هو العلاوة.", "**خسارته ممكن تكون كبيرة:** لو السهم تحرك بقوة ضده.", "**البيع المكشوف (Naked):** تبيع Call بدون ما تملك السهم. خسارته **مفتوحة** نظرياً. هذا ممنوع على المبتدئ، وأغلب الوسطاء ما يسمحون فيه إلا بأعلى مستوى موافقة.", "**البيع المغطى:** إما تملك الأسهم (Covered Call)، أو تحجز الكاش كامل لشرائها (Cash-Secured Put). هذي الطرق اللي نشرحها في الدرسين الجاية."]],
    ["warn", "البيع يعطي ربح صغير متكرر، وأحياناً خسارة كبيرة تاكل أرباح شهور. الناس يوصفونه بـ\"تلقط ريالات قدام الحادلة\". النجاح فيه يجي من اختيار أسهم تبي تملكها أصلاً، وحجم صغير، وانضباط."],
    ["q", "بعت Put وأخذت علاوة 150$. وش أعلى ربح ممكن من هذي الصفقة؟", ["150$", "مفتوح", "يعتمد على صعود السهم"], 0, "البائع أعلى ربح له العلاوة اللي استلمها، مهما طلع السهم."]
  ] },
  { t: "8. البيع المغطى (Covered Call)", b: [
    ["p", "عندك 100 سهم أو أكثر، وتبيع عليها Call بسعر تنفيذ فوق السعر الحالي. تاخذ العلاوة كدخل إضافي، ومقابلها توافق تبيع أسهمك بسعر التنفيذ لو وصله."],
    ["ex", "عندك 100 سهم أبل اشتريتها بـ 200$. تبيع Call تنفيذه 210$ ينتهي بعد 30 يوم بعلاوة 3$، فتستلم **300$**.\n- لو بقى السهم تحت 210$: تحتفظ بالأسهم والـ 300$، وتقدر تعيدها الشهر الجاي.\n- لو طلع فوق 210$: أسهمك تنباع بـ 210$. ربحك (210 − 200 + 3) × 100 = **1,300$**، وهذا أعلى شي حتى لو وصل 250$.\n- لو نزل لـ 180$: خسارة الأسهم 2,000$ والعلاوة تخففها لـ **1,700$**."],
    ["ul", ["مناسب لما تتوقع السهم يمشي عرضي أو يطلع بهدوء.", "اختر سعر تنفيذ ترضى تبيع عنده فعلاً.", "قاعدة شائعة عند البائعين: يقفلون الصفقة لما تحقق 50% من العلاوة، بدل ما ينتظرون الانتهاء.", "انتبه لتواريخ التوزيعات: قبلها ممكن ينطلب منك التنفيذ مبكراً."]],
    ["q", "في المثال فوق، السهم وصل 240$. وش اللي صار؟", ["ربحت 4,300$", "ربحت 1,300$ وفاتك باقي الصعود", "خسرت"], 1, "التزمت تبيع بـ 210$، فربحك محدود بـ 1,300$. هذا ثمن العلاوة اللي أخذتها."]
  ] },
  { t: "9. بيع Put مضمون بالكاش، وعجلة العقود (The Wheel)", b: [
    ["p", "تبيع Put على سهم **تبي تشتريه أصلاً**، بسعر تنفيذ أقل من سعره الحالي، وتحجز كامل مبلغ الشراء كاش في حسابك. تاخذ العلاوة الحين."],
    ["ex", "أبل 200$ وتبي تشتريه لو نزل. تبيع Put تنفيذه 190$ ينتهي بعد 30 يوم بعلاوة 2.50$، فتستلم **250$** وتحجز 19,000$.\n- لو بقى فوق 190$: العقد ينتهي، وتحتفظ بالـ 250$ (حوالي 1.3% على المبلغ المحجوز في شهر).\n- لو نزل لـ 180$: تشتري 100 سهم بـ 190$، لكن تكلفتك الفعلية 187.50$ بسبب العلاوة. خسارتك على الورق (180 − 187.50) × 100 = **750$**."],
    ["p", "**العجلة (The Wheel):** تبيع Put مضمون ⟵ إذا انطلب منك التنفيذ وصارت عندك الأسهم، تبيع عليها Covered Call ⟵ إذا انباعت الأسهم، ترجع تبيع Put. وكل لفة تجمع علاوة."],
    ["warn", "العجلة تنجح على أسهم قوية تقبل تمسكها سنين لو نزلت. على سهم ضعيف ممكن تلقى نفسك ماسك أسهم نازلة 40% وأنت تجمع علاوات صغيرة عليها."],
    ["q", "وش أهم شرط قبل ما تبيع Put مضمون؟", ["العلاوة تكون كبيرة", "تكون فعلاً تبي تملك السهم بهذا السعر وعندك الكاش كامل", "السهم يكون نازل بقوة"], 1, "أسوأ سيناريو إنك تشتري السهم. إذا ما تبيه، لا تبيع عليه Put."]
  ] },
  { t: "10. قبل أول صفقة: المخاطر والقواعد", b: [
    ["ul", ["**ابدأ بحساب تجريبي** (Paper Trading) عند الوسيط لمدة شهر على الأقل، وسجل كل صفقة في مكتبي.", "**مستويات الموافقة:** الوسيط يطلب منك تعبي استبيان. غالباً المستوى الأول يسمح بالبيع المغطى والمضمون، والثاني بالشراء، والأعلى بالاستراتيجيات المعقدة والبيع المكشوف.", "**أوقات التداول:** من 9:30 ص إلى 4:00 م بتوقيت نيويورك، يعني 4:30 م إلى 11:00 م بتوقيت الرياض في التوقيت الصيفي، و5:30 م إلى 12:00 بالليل في الشتوي.", "**لا تدخل قبل النتائج المالية** وأنت مبتدئ، بسبب انهيار التذبذب.", "**الحجم:** للشراء لا تخاطر بأكثر من 1 إلى 2% في الصفقة. للبيع المضمون، لا تحجز كل محفظتك في سهم واحد.", "**لا تبيع مكشوف أبداً** وأنت تتعلم.", "**الرسوم:** فيه عمولة لكل عقد عند أغلب الوسطاء. حطها في الحاسبة."]],
    ["warn", "الجانب الشرعي: كثير من العلماء والهيئات الشرعية يرون إن عقود الخيارات غير جائزة، وفيه من يجيز بعض صورها. إذا يهمك هالجانب، اسأل جهة شرعية موثوقة قبل ما تتداول."],
    ["p", "هذي الدروس تعليم فقط، مو توصية بأي صفقة. القرار والمسؤولية عليك."]
  ] },
  { t: "11. الفرز الشرعي للأسهم ونسبة التطهير", b: [
    ["p", "قبل ما تدخل أي سهم، أو تتداول عقد عليه، تأكد إن **السهم نفسه متوافق**. الفرز يمر بمرحلتين: نشاط الشركة، ثم نسبها المالية."],
    ["p", "**المرحلة الأولى: نشاط الشركة.** الأصل في النشاط الإباحة، ويُستبعد السهم إذا كان نشاطه الأساسي محرم، مثل:"],
    ["ul", ["البنوك التقليدية والتمويل بالفائدة.", "التأمين التقليدي.", "الخمور ولحم الخنزير.", "القمار والكازينوهات.", "الترفيه والمحتوى المحرم."]],
    ["p", "**المرحلة الثانية: النسب المالية.** الشركة نشاطها مباح، لكن ممكن تقترض بفائدة أو تودع فلوسها بفائدة. أشهر معيار هو معيار هيئة المحاسبة والمراجعة للمؤسسات المالية الإسلامية (AAOIFI):"],
    ["ul", ["**الديون بفائدة** أقل من **30%** من القيمة السوقية للشركة.", "**النقد والاستثمارات بفائدة** أقل من **30%** من القيمة السوقية.", "**الدخل غير المباح** (مثل فوائد الودائع) أقل من **5%** من إجمالي الإيرادات."]],
    ["p", "بعض الهيئات تقيس على **إجمالي الأصول** بدل القيمة السوقية، أو تاخذ متوسط القيمة السوقية خلال الربع. عشان كذا ممكن تلقى سهم متوافق في تطبيق، و«محل نظر» في تطبيق ثاني."],
    ["ex", "**مثال:** شركة قيمتها السوقية 100 مليار، وإيراداتها 50 مليار.\n- عليها ديون بفائدة 20 مليار، يعني 20%: تحت الحد.\n- عندها ودائع بفائدة 10 مليار، يعني 10%: تحت الحد.\n- دخلها من الفوائد 1 مليار من 50، يعني 2%: تحت الحد.\n- **النتيجة:** متوافقة، و**نسبة التطهير** حوالي **2%**."],
    ["p", "**التصنيفات اللي تشوفها في التطبيقات:** متوافق، غير متوافق، أو **محل نظر**. محل نظر غالباً معناها إن الشركة قريبة من الحدود، أو بياناتها تحتاج مراجعة، أو نشاطها فيه جزء مختلف عليه."],
    ["p", "**نسبة التطهير** هي نسبة الدخل غير المباح من إيرادات الشركة. تحسب منها المبلغ اللي تتصدق فيه عشان تطهّر دخلك من السهم:"],
    ["ex", "**على التوزيعات:** استلمت توزيعات 300$، ونسبة التطهير 2%. تتصدق بـ 300 × 2% = **6$**.\n- **على الأرباح من البيع:** بعض الهيئات تطلب تطهير نسبة من الربح نفسه: ربحك 1,000$ × 2% = **20$**.\n- وبعضها يحسب الدخل غير المباح للسهم الواحد × عدد أسهمك × مدة تملكك من السنة.\n- **اتبع طريقة المصدر اللي تعتمده** في الحساب، ولا تخلط بين طريقتين."],
    ["ul", ["**الحالة تتغير:** الشركات تُفرز كل ربع سنة مع قوائمها المالية. سهم متوافق اليوم ممكن يتغير.", "**إذا تغيرت الحالة:** الهيئة الشرعية للراجحي المالية مثلاً تطلب البيع خلال 90 يوم من صدور القائمة.", "**راجع قبل كل صفقة،** مو بس أول مرة تشتري السهم، عشان ما تتفاجأ بعد ما تصرف فلوسه."]],
    ["warn", "الفرز يخص **السهم الأساسي**. عقد الأوبشن نفسه له حكم مستقل والعلماء مختلفين فيه. السهم المتوافق ما يعني إن كل أنواع العقود عليه جائزة، فاسأل جهة شرعية تثق فيها."],
    ["q", "شركة نشاطها مباح، ديونها بفائدة 35% من قيمتها السوقية، ودخلها غير المباح 1%. وش حالتها حسب معيار AAOIFI؟", ["متوافقة لأن الدخل المحرم قليل", "غير متوافقة لأن الديون فوق 30%", "ما نقدر نحكم"], 1, "يكفي يتعدى معيار واحد الحد عشان السهم يطلع غير متوافق. الديون 35% فوق حد 30%."],
    ["q", "استلمت توزيعات 500$ من سهم نسبة تطهيره 3%. كم تتصدق؟", ["3$", "15$", "150$"], 1, "500 × 3% = 15$."]
  ] },
  { t: "12. أوردر فلو: قراءة السيولة لحظة بلحظة", b: [
    ["p", "**أوردر فلو (Order Flow)** هو إنك تشوف الأوامر الفعلية وهي تنفذ، مو بس الشمعة بعد ما تقفل. الشمعة تقول لك وين راح السعر، والأوردر فلو يقول لك **مين دفعه**."],
    ["ul", ["**شريط الصفقات (Time & Sales):** كل صفقة تنفذ: الوقت، السعر، الكمية، وهل نفذت على سعر البائع (مشتري مستعجل) أو على سعر المشتري (بايع مستعجل).", "**دفتر الأوامر (Level 2 / DOM):** الأوامر المعلقة تحت السعر وفوقه. تكدس أوامر شراء كبيرة عند سعر معين يبان كجدار دعم.", "**دلتا الحجم (Delta):** حجم الشراء المستعجل ناقص حجم البيع المستعجل في الشمعة. والدلتا التراكمية (CVD) مجموعها مع الوقت.", "**شارت البصمة (Footprint):** يفتح الشمعة من داخل ويوريك كم انتداول شراء وبيع عند كل سعر."]],
    ["ex", "**مثال:** السهم وصل مقاومة 150$.\n- الشريط يطلع صفقات شراء كبيرة متتالية على سعر البائع، والدلتا موجبة وتكبر: المشترين يدفعون بقوة، واحتمال الاختراق أعلى.\n- السعر لمس 150$ بس الدلتا سالبة وفيه أوامر بيع كبيرة تتجدد عند 150$ في الدفتر: البايعين ماسكين المستوى، واحتمال الارتداد أعلى."],
    ["warn", "الأوامر المعلقة في الدفتر ممكن تنلغى بلحظة، وفيه من يحطها عشان يخدع (Spoofing). الأقوى هو اللي **نفذ فعلاً** في الشريط والدلتا، مو اللي معلق."],
    ["p", "**وش تحتاج:** بيانات لحظية مدفوعة من البورصة ومنصة تعرضها. في مِراس عندنا شموع يومية بس، فحطينا في الشارت مؤشرات سيولة تقريبية: **الحجم النسبي، OBV، CMF، MFI، وVWAP**. تعطيك فكرة عن دخول وخروج الفلوس، بس مو بديل عن الأوردر فلو اللحظي."],
    ["q", "الشمعة خضراء وقوية، بس الدلتا فيها سالبة بشكل كبير. وش ممكن يعني؟", ["المشترين مسيطرين بالكامل", "فيه بيع مستعجل كبير امتصه مشتري بأوامر معلقة، والصعود ممكن يكون ضعيف", "ما يعني شي"], 1, "الدلتا السالبة تعني إن البيع المستعجل كان أكبر. ارتفاع السعر رغمها غالباً سببه أوامر شراء معلقة كبيرة امتصت البيع، وهذا يحتاج متابعة."]
  ] },
  { t: "13. أوبشن فلو: تتبع العقود الكبيرة", b: [
    ["p", "**أوبشن فلو (Options Flow)** هو متابعة صفقات العقود الكبيرة أو غير العادية لحظة تنفيذها. الفكرة: لما أحد يدفع ملايين الدولارات على عقود Call قريبة الانتهاء، غالباً عنده قناعة قوية، وكثير يعتبرونها أثر \u00abالأموال الكبيرة\u00bb."],
    ["ul", ["**Sweep:** أمر كبير ينقسم على أكثر من بورصة بنفس اللحظة عشان ينفذ بسرعة. يدل على استعجال.", "**Block:** صفقة كبيرة وحدة، غالباً متفاوض عليها.", "**حجم أكبر من العقود المفتوحة (Volume > OI):** يعني فيه مراكز جديدة تنفتح اليوم، مو إغلاق قديم.", "**جهة التنفيذ:** على سعر البائع (Ask) يعني شراء، وعلى سعر المشتري (Bid) يعني بيع.", "**نسبة Put/Call:** كم عقد Put مقابل كل Call. نسبة عالية جداً تعني خوف أو تحوط."]],
    ["ex", "**مثال:** على سهم سعره 200$، ينفذ Sweep لشراء 5,000 عقد Call بسعر تنفيذ 220$ ينتهي بعد أسبوعين، على سعر البائع، والحجم أكبر من العقود المفتوحة 10 مرات.\n- **القراءة:** شراء مستعجل لمراكز جديدة على صعود قريب.\n- **بس انتبه:** ممكن يكون تحوط لمحفظة أسهم، أو جزء من استراتيجية أكبر (يشتري Call ويبيع Call ثاني) والأداة تشوف نص الصورة."],
    ["warn", "الأوبشن فلو **دليل مو إشارة**. الصفقات الكبيرة تخسر بعد، وما تعرف هدف صاحبها. استخدمه مع تحليلك للسهم ومستوياته، مو لحاله."],
    ["p", "**وش تحتاج:** خدمة متخصصة تعرض العقود الكبيرة لحظياً، أغلبها باشتراك شهري، أو منصة الوسيط إذا توفرها. أول ما يرسل لك أخوك رابط المنصة اللي يستخدمها، نضيفها لمكتبي كرابط مباشر."],
    ["q", "شفت صفقة شراء ضخمة لعقود Put على سهم. وش الأحوط في قراءتها؟", ["أكيد السهم بينزل", "ممكن تكون رهان على نزول أو تحوط لمحفظة، فتأكدها من تحليلك", "أشتري Put معه على طول"], 1, "صفقات Put الكبيرة كثير منها تحوط لمراكز أسهم. ما تعرف نية صاحبها، فخذها كمعلومة إضافية."]
  ] }
];

const opFmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function opBlock(b, li, bi) {
  const [k, v] = b;
  if (k === "p") return "<p>" + opFmt(v) + "</p>";
  if (k === "ul" || k === "ol") return "<" + k + ">" + v.map((x) => "<li>" + opFmt(x) + "</li>").join("") + "</" + k + ">";
  if (k === "ex") { const lines = v.split("\n"); return '<div class="op-ex">' + lines.map((x) => (x.startsWith("- ") ? '<div class="op-li">' + opFmt(x.slice(2)) + "</div>" : "<p>" + opFmt(x) + "</p>")).join("") + "</div>"; }
  if (k === "warn") return '<div class="notice">' + opFmt(v) + "</div>";
  if (k === "q") { const [, q, opts, ans, why] = b; return '<div class="op-q" data-ans="' + ans + '"><b>' + esc(t("op_q")) + ":</b> " + opFmt(q) + '<div class="row" style="gap:6px;margin-top:8px">' + opts.map((o, i) => '<button type="button" class="btn sm" data-act="op-pick" data-i="' + i + '">' + esc(o) + "</button>").join("") + '</div><p class="op-why small" hidden>' + opFmt(why) + "</p></div>"; }
  return "";
}

let OPC = { s: "lc", k: 210, p: 3, n: 1, s0: 200, fee: 0.65, at: 220 };
function opCalcNums(c) {
  const m = 100 * c.n, fee = c.fee * c.n, K = c.k, P = c.p, S0 = c.s0;
  const pay = (S) => ({ lc: Math.max(S - K, 0) - P, lp: Math.max(K - S, 0) - P, cc: S - S0 - Math.max(S - K, 0) + P, csp: P - Math.max(K - S, 0) }[c.s] * m - fee);
  const be = { lc: K + P, lp: K - P, cc: S0 - P, csp: K - P }[c.s];
  const maxp = { lc: null, lp: (K - P) * m - fee, cc: (K - S0 + P) * m - fee, csp: P * m - fee }[c.s];
  const maxl = { lc: P * m + fee, lp: P * m + fee, cc: (S0 - P) * m + fee, csp: (K - P) * m + fee }[c.s];
  const cash = { lc: P * m + fee, lp: P * m + fee, cc: S0 * m, csp: K * m }[c.s];
  return { pay, be, maxp, maxl, cash };
}
function opChart(c) {
  const r = opCalcNums(c), lo = Math.max(0, Math.min(c.k, c.s0) * 0.7), hi = Math.max(c.k, c.s0) * 1.3, W = 640, H = 220, pad = 30, N = 80;
  const xs = Array.from({ length: N + 1 }, (_, i) => lo + ((hi - lo) * i) / N), ys = xs.map(r.pay);
  let ymin = Math.min(...ys, 0), ymax = Math.max(...ys, 0); const sp = ymax - ymin || 1; ymin -= sp * 0.08; ymax += sp * 0.08;
  const X = (x) => pad + ((x - lo) / (hi - lo)) * (W - pad * 2), Y = (y) => 10 + ((ymax - y) / (ymax - ymin)) * (H - 40);
  const pts = xs.map((x, i) => X(x).toFixed(1) + "," + Y(ys[i]).toFixed(1)).join(" ");
  const pos = xs.map((x, i) => X(x).toFixed(1) + "," + Y(Math.max(ys[i], 0)).toFixed(1)).join(" "), neg = xs.map((x, i) => X(x).toFixed(1) + "," + Y(Math.min(ys[i], 0)).toFixed(1)).join(" ");
  const y0 = Y(0), ticks = [lo, c.k, hi].map((v) => '<text x="' + X(v) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" fill="var(--muted)">$' + fmt(v, 0) + "</text>").join("");
  return '<svg class="op-chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="payoff" dir="ltr"><polygon points="' + X(lo) + "," + y0 + " " + pos + " " + X(hi) + "," + y0 + '" fill="var(--up)" opacity=".14"/><polygon points="' + X(lo) + "," + y0 + " " + neg + " " + X(hi) + "," + y0 + '" fill="var(--down)" opacity=".14"/><line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="var(--line)" stroke-width="1.2"/><line x1="' + X(c.k) + '" x2="' + X(c.k) + '" y1="10" y2="' + (H - 30) + '" stroke="var(--muted)" stroke-dasharray="3 3"/>' + (r.be > lo && r.be < hi ? '<circle cx="' + X(r.be) + '" cy="' + y0 + '" r="4" fill="var(--amber)"/>' : "") + '<polyline points="' + pts + '" fill="none" stroke="var(--ink)" stroke-width="2"/>' + ticks + "</svg>";
}
function opCalcBody() {
  const c = OPC, r = opCalcNums(c), at = r.pay(c.at);
  return '<div class="result"><div><span>' + esc(t("op_be")) + "</span><b>$" + fmt(r.be) + "</b></div><div><span>" + esc(t("op_maxp")) + "</span><b>" + (r.maxp == null ? esc(t("op_unl")) : "$" + fmt(r.maxp)) + "</b></div><div><span>" + esc(t("op_maxl")) + "</span><b>$" + fmt(r.maxl) + "</b></div><div><span>" + esc(t("op_cash")) + "</span><b>$" + fmt(r.cash, 0) + "</b></div><div><span>" + esc(t("op_res")) + " @ $" + fmt(c.at) + "</span><b>" + dkSign(at) + "</b></div></div>" + opChart(c);
}
function opCalc() {
  const f = (id, k, v, step) => '<div class="field"><label for="opc-' + id + '">' + esc(t(k)) + '</label><input id="opc-' + id + '" data-opc="' + id + '" type="number" min="0" step="' + step + '" inputmode="decimal" value="' + v + '"></div>';
  return owPanel(t("op_calc"), '<div class="form-grid"><div class="field"><label for="opc-s">' + esc(t("op_strat")) + '</label><select id="opc-s" data-opc="s">' + [["lc", "op_lc"], ["lp", "op_lp"], ["cc", "op_cc"], ["csp", "op_csp"]].map(([v, k]) => '<option value="' + v + '"' + (OPC.s === v ? " selected" : "") + ">" + esc(t(k)) + "</option>").join("") + "</select></div>" +
    f("k", "op_k", OPC.k, "0.5") + f("p", "op_p", OPC.p, "0.05") + f("n", "op_n", OPC.n, "1") + f("s0", "op_s0", OPC.s0, "0.5") + f("fee", "op_fee", OPC.fee, "0.05") + f("at", "op_at", OPC.at, "0.5") + '</div><div id="opc-out">' + opCalcBody() + "</div>");
}
function dkOptions() {
  return '<p class="muted" style="margin:0">' + esc(t("op_intro")) + "</p>" + opCalc() + '<div class="stack op-lessons">' + OP_LESSONS.map((l, li) => '<details class="panel op-lesson"' + (li === 0 ? " open" : "") + "><summary><h3>" + esc(l.t) + "</h3></summary>" + l.b.map((b, bi) => opBlock(b, li, bi)).join("") + "</details>").join("") + "</div>";
}

document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.opc; if (!k) return;
  OPC[k] = k === "s" ? e.target.value : Math.max(0, parseFloat(e.target.value) || 0);
  const o = document.getElementById("opc-out"); if (o) o.innerHTML = opCalcBody();
});
document.addEventListener("change", (e) => { if (e.target.dataset && e.target.dataset.opc === "s") { OPC.s = e.target.value; const o = document.getElementById("opc-out"); if (o) o.innerHTML = opCalcBody(); } });
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest('[data-act="op-pick"]'); if (!b) return;
  const box = b.closest(".op-q"), ok = Number(b.dataset.i) === Number(box.dataset.ans);
  box.querySelectorAll('[data-act="op-pick"]').forEach((x) => x.classList.remove("on-ok", "on-bad"));
  b.classList.add(ok ? "on-ok" : "on-bad"); b.setAttribute("aria-label", t(ok ? "op_right" : "op_wrong"));
  if (ok) box.querySelector(".op-why").hidden = false;
});
/* ===== التشغيل ===== */
lastRoute = route();
render();
if (HOSTED && CFG.token) { syncNow(true).then(() => loadPrices(true)).then(() => loadWatch()); }
</script>
